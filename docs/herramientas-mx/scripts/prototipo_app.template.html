<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas FTS</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#1c1c1c;--mut:#666;--acc:#b71c1c;--ok:#2e7d32;--warn:#e65100;--line:#e0e0e0;--chip:#eee}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--ink:#eee;--mut:#aaa;--line:#333;--chip:#2a2a2a}}
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}header button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:16px;padding:5px 10px;font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
.demo{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.est{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;color:#fff}
.EN_TALLER{background:#546e7a}.EN_TRANSITO{background:#6a1b9a}.EN_USO{background:var(--ok)}.RESGUARDADO{background:#1565c0}.EN_TRANSFERENCIA{background:#ef6c00}.EXTRAVIADO{background:#c62828}
.mut{color:var(--mut);font-size:13px}.al{font-size:12.5px;padding:6px 8px;border-radius:8px;margin-top:6px}
.al.r{background:#ffebee;color:#b71c1c}.al.a{background:#fff8e1;color:#8d5a00}
button.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;width:100%;margin-top:8px}
button.s{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;width:100%;margin-top:8px}
button.ok{background:var(--ok)}
label{display:block;font-size:13px;margin-top:10px;color:var(--mut)}select,input{width:100%;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.foto{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;margin-top:8px;font-size:14px}
.foto.ok{border-color:var(--ok);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.svgw svg{width:100%;height:auto;background:#fff;border-radius:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex}
nav button{flex:1;background:none;border:0;padding:10px 4px;font-size:12px;color:var(--mut)}nav button.on{color:var(--acc);font-weight:700}
.pieza{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.pieza input{width:auto}
.caseta{background:#fff;color:#000;border:1px solid #999;padding:10px;font-size:12px}
.hist{font-size:12.5px;border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
</style></head><body>
<header><h1 id="tit">Mis kits</h1><button onclick="reset()">Reiniciar demo</button></header>
<main id="app"></main>
<nav><button id="n-kits" onclick="go('kits')">Mis kits</button><button id="n-alertas" onclick="go('alertas')">Alertas</button><button id="n-hist" onclick="go('hist')">Historial</button></nav>
<script>
const DEMO = __DEMO__;
let S;
function load(){try{const x=localStorage.getItem('fts_herr_demo');S=x?JSON.parse(x):null}catch(e){S=null}
 if(!S){S={kits:JSON.parse(JSON.stringify(DEMO.kits)),eventos:[],tareas:[{id:'T1',kit:'FTS-CAR-01',tipo:'reasignacion',disparador:'Plan nocturno: Tecnico A (emp-79) pasa manana a Vertiv',abierta:DEMO.hoy+' 21:40'}],faltantes:[]}}}
function save(){try{localStorage.setItem('fts_herr_demo',JSON.stringify(S))}catch(e){}}
function reset(){try{localStorage.removeItem('fts_herr_demo')}catch(e){};S=null;load();go('kits')}
const P=DEMO.plantas, PER=DEMO.personas, $=id=>document.getElementById(id);
const kit=id=>S.kits.find(k=>k.id===id);
function ahora(){const d=new Date();return DEMO.hoy+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function gps(cb){let done=false;const fb=()=>{if(!done){done=true;cb({lat:25.7,lng:-100.3,prec:null,simulado:true})}};
 try{navigator.geolocation.getCurrentPosition(p=>{if(!done){done=true;cb({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),prec:Math.round(p.coords.accuracy)})}},fb,{timeout:4000})}catch(e){fb()};setTimeout(fb,4500)}
function evento(k,tipo,antes,despues,extra){const ts=ahora(),resp=PER[k.resp];gps(g=>{S.eventos.unshift(Object.assign({ts,kit:k.id,tipo,antes,despues,resp,gps:g.simulado?'GPS simulado (demo)':(g.lat+','+g.lng+' ±'+g.prec+' m')},extra||{}));save()})}
function diasEntre(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function habiles(a,b){let n=0,d=new Date(a+'T12:00:00');const f=new Date(b+'T12:00:00');while(d<f){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)n++}return n}
function alertas(){const out=[];for(const k of S.kits){const pl=P[k.planta];
 if(['EN_USO','RESGUARDADO'].includes(k.estado)&&k.planta!=='TALLER'){const d=habiles(pl.ultima_asistencia,DEMO.hoy);
  if(d>=2)out.push({n:d>=5?'r':'a',k,t:`A1 Kit huerfano: nadie de FTS ha checado en ${pl.nombre} desde ${pl.ultima_asistencia} (${d} dias habiles)`,acc:'retiro'});
  if(d>=10)out.push({n:'r',k,t:`A2 Proyecto sin actividad ${d} dias habiles y sigue "${pl.stage}": pedir retiro o transferencia`,acc:'retiro'})}
 const dr=habiles(k.ult_revision,DEMO.hoy),dn=diasEntre(k.ult_revision,DEMO.hoy);
 if(k.estado==='EN_USO'&&dr>=1)out.push({n:dr>=2?'r':'a',k,t:`A3 Sin revision desde ${k.ult_revision}`,acc:'revision'});
 if(k.estado==='RESGUARDADO'&&dn>=7)out.push({n:'a',k,t:`A3 Resguardado sin revision desde ${k.ult_revision} (> 7 dias)`,acc:'revision'});
 if(k.estado==='EN_TRANSFERENCIA')out.push({n:'a',k,t:'A6 Transferencia abierta: quien recibe no ha confirmado',acc:'recibir'})}
 for(const f of S.faltantes)out.push({n:'r',k:kit(f.kit),t:`A4 Faltante: ${f.activo} ${f.desc}`,acc:'revision'});
 for(const t of S.tareas)out.push({n:'r',k:kit(t.kit),t:`A7 Reasignacion pendiente: ${t.disparador}`,acc:'reasignar'});
 return out}
function go(v,arg){for(const b of document.querySelectorAll('nav button'))b.classList.remove('on');const nb=$('n-'+v);if(nb)nb.classList.add('on');
 const T={kits:'Mis kits',alertas:'Alertas',hist:'Historial'};$('tit').textContent=T[v]||'Kit '+(arg||'');V[v](arg);window.scrollTo(0,0)}
const V={};
V.kits=()=>{const al=alertas();$('app').innerHTML=`<div class="demo">Prototipo con datos de EJEMPLO. Plantas y personas ficticias o seudonimizadas (emp-id). Nada se guarda fuera de este navegador.</div>`+
 S.kits.map(k=>{const a=al.filter(x=>x.k===k);return `<div class="card"><div class="row"><b>${k.id}</b><span class="sp"></span><span class="est ${k.estado}">${k.estado.replace('_',' ')}</span></div>
 <div class="mut">${P[k.planta].nombre}${k.lugar&&k.estado==='RESGUARDADO'?' · '+k.lugar:''}<br>Responsable: ${PER[k.resp]}<br>Modulos: ${k.modulos.join(', ')} · ultima revision ${k.ult_revision}</div>
 ${a.map(x=>`<div class="al ${x.n}">${x.t}</div>`).join('')}${acciones(k)}</div>`}).join('')};
function acciones(k){const b=(t,f,c)=>`<button class="${c||'b'}" onclick="${f}">${t}</button>`;const id=`'${k.id}'`;
 if(S.tareas.some(t=>t.kit===k.id))return b('Resolver reasignacion (obligatorio)',`go('reasignar',${id})`);
 switch(k.estado){case 'EN_TALLER':return b('Preparar salida de FTS',`go('salida',${id})`);
 case 'EN_TRANSITO':return b('Llegue a planta',`go('llegada',${id})`);
 case 'EN_USO':return b('Revision diaria',`go('revision',${id})`)+b('Resguardar al terminar',`go('resguardo',${id})`,'s')+b('Retirar de planta',`go('retiro',${id})`,'s');
 case 'RESGUARDADO':return b('Abrir y usar',`abrir(${id})`)+b('Revision',`go('revision',${id})`,'s')+b('Retirar de planta',`go('retiro',${id})`,'s');
 case 'EN_TRANSFERENCIA':return b('Recibir kit (quien recibe)',`recibir(${id})`);default:return''}}
function foto(id,txt){return `<div class="foto" id="${id}" onclick="tomar('${id}')">📷 ${txt}<br><span class="mut">(toca para tomar foto)</span><input type="file" accept="image/*" capture="environment" style="display:none" onchange="this.parentNode.classList.add('ok');this.parentNode.firstChild.textContent='✅ Foto tomada '"></div>`}
function tomar(id){const e=$(id);if(e.classList.contains('ok'))return;const i=e.querySelector('input');try{i.click()}catch(x){};setTimeout(()=>{if(!e.classList.contains('ok')){e.classList.add('ok');e.firstChild.textContent='✅ Foto simulada (demo) '}},600)}
function fotosOk(ids){return ids.every(i=>$(i).classList.contains('ok'))}
function listaKit(k){const mods=k.modulos.map(m=>m.split('-')[0]);let rows=[];for(const c of DEMO.cajones_base)for(const p of c.piezas)rows.push([p.activo.replace('-01-','-'+k.modulos[0].split('-')[1]+'-'),p.desc]);
 if(mods.includes('ELE'))for(const c of DEMO.cajones_ele)for(const p of c.piezas)rows.push([p.activo,p.desc]);return rows}
V.salida=id=>{const k=kit(id);$('app').innerHTML=`<div class="card"><b>Salida de FTS · ${id}</b><div class="mut">Confirma los modulos montados. La lista de piezas del formato de caseta sale de aqui.</div>
 <label>Modulo de especialidad</label><select id="mod"><option value="">Solo base</option><option>ELE-02</option><option>SOL-02</option><option>TUB-01</option><option>MED-01</option></select>
 <label>Planta destino</label><select id="dest">${Object.entries(P).filter(([c])=>c!=='TALLER').map(([c,p])=>`<option value="${c}">${p.nombre}</option>`).join('')}</select>
 <label>Responsable en planta (encargado del frente)</label><select id="resp">${['e79','e6'].map(p=>`<option value="${p}">${PER[p]}</option>`).join('')}</select>
 <div class="mut" style="margin-top:8px">Linea base: se hace una revision completa antes de salir.</div>
 ${foto('f1','Foto del carrito cerrado con candados')}
 <button class="b" onclick="salir('${id}')">Confirmar salida · pasa a EN TRANSITO</button><button class="s" onclick="go('kits')">Cancelar</button></div>`};
function salir(id){if(!fotosOk(['f1']))return alert('Sin foto no hay cambio de estado.');const k=kit(id),a=k.estado;const m=$('mod').value;if(m)k.modulos=[k.modulos[0],m];k.planta=$('dest').value;k.resp='e154';k.estado='EN_TRANSITO';k.destResp=$('resp').value;k.ult_revision=DEMO.hoy;
 evento(k,'Salida de FTS',a,k.estado,{nota:'Destino '+P[k.planta].nombre});save();go('kits')}
V.llegada=id=>{const k=kit(id);$('app').innerHTML=`<div class="card"><b>Llegada a ${P[k.planta].nombre}</b>${foto('f1','Foto en caseta con el kit')}
 <button class="b" onclick="llegar('${id}')">Registrar llegada y generar formato de caseta</button></div><div id="fmt"></div>`};
function llegar(id){if(!fotosOk(['f1']))return alert('Sin foto no hay cambio de estado.');const k=kit(id),a=k.estado;k.estado='EN_USO';k.resp=k.destResp||'e79';evento(k,'Llegada a planta',a,k.estado);save();
 $('fmt').innerHTML=caseta(k,'ENTRADA')+`<button class="b ok" onclick="go('kits')">Listo · entregado en caseta</button>`}
function caseta(k,tipo){const rows=listaKit(k);return `<div class="card caseta"><b>FORMATO DE ${tipo} DE HERRAMIENTA · ${P[k.planta].nombre}</b><br>Contratista: Servicios FTS · Kit ${k.id} · Modulos ${k.modulos.join(', ')}<br>Fecha: ${ahora()} · Responsable FTS: ${PER[k.resp]}<br>
 <b>${tipo==='ENTRADA'?'Ampara el kit mientras permanezca en planta: no se repite cada dia.':'Salida definitiva de planta.'}</b>
 <table><tr><th>#</th><th>Activo</th><th>Descripcion</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
 <br>Total de piezas: ${rows.length}<br><br>Firma vigilancia: ____________________ &nbsp; Firma FTS: ____________________</div>`}
V.resguardo=id=>{const k=kit(id);$('app').innerHTML=`<div class="card"><b>Resguardo en ${P[k.planta].nombre}</b><div class="mut">Solo lugares asignados por el cliente. No existe la opcion "cajon general".</div>
 <label>Lugar</label><select id="lug">${P[k.planta].lugares.map(l=>`<option>${l}</option>`).join('')}</select>
 <label>Candado del lugar (id)</label><input id="cand" value="CAND-${k.id.slice(-2)}-01">
 <label>Combinacion (se guarda cifrada; solo la ve el supervisor SR)</label><input id="comb" type="password" inputmode="numeric" maxlength="4" placeholder="4 digitos">
 ${foto('f1','Foto del lugar CERRADO con el candado visible')}
 <button class="b" onclick="resguardar('${id}')">Resguardar · pasa a RESGUARDADO</button><button class="s" onclick="go('kits')">Cancelar</button></div>`};
function resguardar(id){if(!fotosOk(['f1']))return alert('Sin foto del lugar cerrado no se resguarda.');if(!/^\d{4}$/.test($('comb').value))return alert('Registra la combinacion (4 digitos).');
 const k=kit(id),a=k.estado;k.estado='RESGUARDADO';k.lugar=$('lug').value;evento(k,'Resguardo',a,k.estado,{nota:k.lugar+' · candado '+$('cand').value});save();go('kits')}
function abrir(id){const k=kit(id),a=k.estado;k.estado='EN_USO';evento(k,'Abrir resguardo',a,k.estado);save();go('kits')}
let RV=null;
V.revision=id=>{const k=kit(id);const caj=[...DEMO.cajones_base.map(c=>({...c,m:'BAS'})),...(k.modulos.some(m=>m.startsWith('ELE'))?DEMO.cajones_ele.map(c=>({...c,m:'ELE'})):[])];
 const nb=k.modulos[0].split('-')[1];caj.forEach(c=>{if(c.m==='BAS')c.piezas=c.piezas.map(p=>({...p,activo:p.activo.replace('-01-','-'+nb+'-')}))});
 RV={id,caj,i:0,falt:[],t0:Date.now()};pasoRev()};
function pasoRev(){const c=RV.caj[RV.i];$('app').innerHTML=`<div class="card"><div class="row"><b>Revision ${RV.id}</b><span class="sp"></span><span class="mut">Cajon ${RV.i+1} de ${RV.caj.length}</span></div>
 <div class="mut">Abre el cajon ${c.m}-C${c.n}, toma la foto y compara contra la silueta. Un hueco amarillo es una pieza faltante.</div>
 <div class="svgw">${DEMO.svgs[c.svg]||''}</div>${foto('f1','Foto del cajon '+c.m+'-C'+c.n+' abierto')}
 <div style="margin-top:8px">${c.piezas.map(p=>`<label class="pieza"><input type="checkbox" data-a="${p.activo}" data-d="${p.desc}"> Falta ${p.activo} · ${p.desc}</label>`).join('')}</div>
 <button class="b ok" onclick="sigRev()">${RV.i+1<RV.caj.length?'Siguiente cajon':'Terminar revision'}</button></div>`}
function sigRev(){if(!fotosOk(['f1']))return alert('Toma la foto del cajon.');for(const x of document.querySelectorAll('.pieza input:checked'))RV.falt.push({kit:RV.id,activo:x.dataset.a,desc:x.dataset.d});
 RV.i++;if(RV.i<RV.caj.length)return pasoRev();const k=kit(RV.id);k.ult_revision=DEMO.hoy;S.faltantes=S.faltantes.filter(f=>f.kit!==k.id).concat(RV.falt);
 const min=((Date.now()-RV.t0)/60000).toFixed(1);evento(k,'Revision',k.estado,k.estado,{nota:`${RV.caj.length} cajones, ${RV.falt.length} faltantes, ${min} min`});save();
 $('app').innerHTML=`<div class="card"><b>Revision terminada</b><div class="mut">${RV.caj.length} cajones en ${min} min · ${RV.falt.length} faltantes${RV.falt.length?' → alerta A4 al supervisor SR':''}</div><button class="b" onclick="go('kits')">Volver</button></div>`}
V.reasignar=id=>{const k=kit(id),t=S.tareas.find(x=>x.kit===id);$('app').innerHTML=`<div class="card"><b>¿Que pasa con ${id} en ${P[k.planta].nombre}?</b>
 <div class="al r">${t.disparador}. El kit esta a su nombre. No puede cerrar el cambio sin resolverlo (escala al supervisor a las 24 h y a Felipe a las 48 h).</div>
 <button class="s" onclick="opc('queda')">1 · Se queda con otro responsable en esta planta</button>
 <button class="s" onclick="opc('transf')">2 · Se transfiere a otra planta</button>
 <button class="s" onclick="opc('retira')">3 · Se retira a taller</button><div id="op"></div></div>`};
function opc(o){const id=S.tareas[0].kit,k=kit(id);if(o==='queda')$('op').innerHTML=`<label>Nuevo responsable (con asistencia en ${P[k.planta].nombre} hoy o ayer)</label><select id="nr"><option value="e6">${PER.e6}</option></select>
 <div class="mut">Como el responsable anterior conocia la combinacion, la app pide cambiarla (alerta A5 si no).</div><label>Nueva combinacion</label><input id="nc" type="password" maxlength="4" inputmode="numeric">${foto('f1','Foto de entrega: el nuevo responsable con el kit')}
 <button class="b" onclick="resolver('queda')">Confirmar con PIN del nuevo responsable</button>`;
 if(o==='transf')$('op').innerHTML=`<label>Planta destino</label><select id="pd">${Object.entries(P).filter(([c])=>c!=='TALLER'&&c!==k.planta).map(([c,p])=>`<option value="${c}">${p.nombre}</option>`).join('')}</select>
 <label>Quien recibe</label><select id="qr"><option value="e79">${PER.e79}</option></select>${foto('f1','Foto del kit cerrado al salir')}
 <div class="mut">Se generan formato de SALIDA en origen y de ENTRADA en destino. Si nadie confirma en 48 h pasa a EXTRAVIADO.</div><button class="b" onclick="resolver('transf')">Transferir</button>`;
 if(o==='retira'){go('retiro',id)}}
function resolver(o){if(!fotosOk(['f1']))return alert('Sin foto no hay cambio de estado.');const t=S.tareas.shift(),k=kit(t.kit),a=k.estado;
 if(o==='queda'){if(!/^\d{4}$/.test($('nc').value))return (S.tareas.unshift(t),alert('Cambia la combinacion.'));k.resp=$('nr').value;evento(k,'Reasignacion: se queda',a,k.estado,{nota:'Nuevo responsable '+PER[k.resp]+'; combinacion cambiada'})}
 if(o==='transf'){k.estado='EN_TRANSFERENCIA';k.destino=$('pd').value;k.destResp=$('qr').value;evento(k,'Reasignacion: transferencia',a,k.estado,{nota:'Destino '+P[k.destino].nombre})}
 save();go('kits')}
function recibir(id){const k=kit(id),a=k.estado;k.estado='EN_USO';k.planta=k.destino||k.planta;k.resp=k.destResp||k.resp;evento(k,'Transferencia recibida',a,k.estado,{nota:'Formato de entrada generado en '+P[k.planta].nombre});save();
 $('app').innerHTML=caseta(k,'ENTRADA')+`<button class="b ok" onclick="go('kits')">Listo</button>`}
V.retiro=id=>{const k=kit(id);$('app').innerHTML=`<div class="card"><b>Retiro de ${P[k.planta].nombre}</b><div class="mut">1) Revision completa · 2) Formato de SALIDA de caseta · 3) Foto al subir a la camioneta.</div>
 <button class="s" onclick="go('revision','${id}')">1 · Hacer revision completa</button>${foto('f1','Foto del kit cargado en la camioneta')}
 <button class="b" onclick="retirar('${id}')">Generar formato de salida y pasar a EN TRANSITO</button></div><div id="fmt"></div>`};
function retirar(id){if(!fotosOk(['f1']))return alert('Sin foto no hay cambio de estado.');const k=kit(id),a=k.estado;S.tareas=S.tareas.filter(t=>t.kit!==id);
 $('fmt').innerHTML=caseta(k,'SALIDA');k.estado='EN_TRANSITO';k.lugar=null;k.resp='e154';k.planta='TALLER';k.destResp='e0';evento(k,'Retiro de planta',a,k.estado);save();$('fmt').innerHTML+=`<button class="b ok" onclick="go('kits')">Listo</button>`}
V.alertas=()=>{const al=alertas();$('app').innerHTML=(al.length?al.map(a=>`<div class="card"><div class="al ${a.n}">${a.t}</div><div class="mut">${a.k.id} · ${P[a.k.planta].nombre} · responsable ${PER[a.k.resp]}</div>
 <button class="s" onclick="go('${a.acc==='retiro'?'retiro':a.acc==='reasignar'?'reasignar':a.acc==='recibir'?'kits':'revision'}','${a.k.id}')">Atender</button></div>`).join(''):'<div class="card">Sin alertas.</div>')+
 `<div class="card mut">Corre a las 7:00 y 19:00 CST en dias habiles. A1 huerfano, A2 proyecto cerrado o parado, A3 sin revision, A4 faltante, A5 combinacion vieja, A6 transito abierto, A7 reasignacion pendiente. Detalle en especificacion_app.md.</div>`};

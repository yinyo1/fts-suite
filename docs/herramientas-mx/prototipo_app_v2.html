<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas FTS v2</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#5f5e57;--line:#d9d6cc;--acc:#f2b705;--ok:#2e7d32;--bad:#c62828;--warn:#b26a00;--chip:#efece3;--info:#1565c0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171714;--card:#22221e;--ink:#f1efe8;--mut:#b3b0a6;--line:#3a3933;--chip:#2d2c27;--ok:#66bb6a;--bad:#ef5350;--warn:#ffb74d;--info:#64b5f6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);padding:8px 16px;display:flex;gap:8px;align-items:center}
header h1{margin:0;font-size:16px;flex:1}header .reloj{font-size:12px;opacity:.85;text-align:right}
#banner{display:none;padding:8px 16px;font-size:13px;background:var(--warn);color:#fff}#banner.on{display:block}
main{max-width:900px;margin:0 auto;padding:10px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;overflow-x:auto}
nav button{flex:1 0 auto;min-width:62px;padding:10px 6px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px}nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.card h2{margin:0 0 6px;font-size:16px}.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.chip{display:inline-block;border-radius:12px;padding:1px 8px;font-size:11px;background:var(--chip)}
.chip.EN_USO{background:var(--ok);color:#fff}.chip.RESGUARDADO{background:var(--info);color:#fff}.chip.EN_TALLER{background:var(--chip)}
.chip.EN_TRANSITO,.chip.EN_TRANSFERENCIA{background:var(--warn);color:#fff}.chip.EXTRAVIADO{background:var(--bad);color:#fff}
.chip.a1,.chip.roja{background:var(--bad);color:#fff}.chip.amarilla{background:var(--acc);color:#1d1d1b}
button.b,button.s{padding:9px 12px;border-radius:8px;border:0;font:inherit;font-weight:600;background:var(--acc);color:#1d1d1b;margin:4px 4px 0 0}
button.s{background:var(--chip);color:var(--ink);font-weight:500}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.foto{border:2px dashed var(--line);border-radius:8px;padding:12px;text-align:center;margin:8px 0;cursor:pointer}.foto.ok{border-color:var(--ok);border-style:solid}
canvas{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.pend{color:var(--warn)}.conf{color:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.kpi div{background:var(--chip);border-radius:8px;padding:8px}.kpi b{display:block;font-size:20px}
@media print{header,nav,#banner,.noprint{display:none!important}body{background:#fff;color:#000}main{padding:0}.card{border:0}}
</style></head>

const PER=DEMO.personas;let S=null;
const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nuevo(){return {reloj:DEMO.inicio,online:true,plantas:clone(DEMO.plantas),kits:clone(DEMO.kits),asist:clone(DEMO.asistencia),eventos:[],outbox:[],srv:[],tareas:[],faltantes:[],n:0}}
function load(){try{const x=localStorage.getItem('fts_herr_v2');S=x?JSON.parse(x):null}catch(e){S=null}if(!S)S=nuevo()}
function save(){try{localStorage.setItem('fts_herr_v2',JSON.stringify(S))}catch(e){}pintarBarra()}
function reset(){S=nuevo();save();go('kits')}
// ------------------------------------------------------------ reloj (simulado)
function fecha(ts){return ts.slice(0,10)}function hora(ts){return ts.slice(11,16)}
function mas(ts,h){const d=new Date(ts+':00');d.setMinutes(d.getMinutes()+Math.round(h*60));const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function horas(a,b){return (new Date(b+':00')-new Date(a+':00'))/36e5}
function habiles(a,b){let n=0;const d=new Date(fecha(a)+'T12:00:00'),f=new Date(fecha(b)+'T12:00:00');while(d<f){d.setDate(d.getDate()+1);const w=d.getDay();if(w&&w!==6)n++}return n}
const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function textoReloj(){const d=new Date(S.reloj+':00');return DIAS[d.getDay()]+' '+fecha(S.reloj)+' '+hora(S.reloj)}
// ------------------------------------------------------------ eventos y cola sin senal
function uuid(){S.n++;return 'ev-'+Date.now().toString(36)+'-'+S.n}
function registrar(tipo,k,antes,despues,extra){const ev=Object.assign({uuid:uuid(),ts:S.reloj,tipo,kit:k?k.id:null,antes,despues,resp:k?k.resp:null,estado:'pendiente'},extra||{});
 S.eventos.unshift(ev);S.outbox.push(ev.uuid);if(S.online)enviar();save();return ev}
function enviar(){ // el servidor es idempotente por uuid y guarda la hora ORIGINAL del evento (no la de envio)
 for(const u of S.outbox){const ev=S.eventos.find(e=>e.uuid===u);if(!ev)continue;if(!S.srv.some(x=>x.uuid===u))S.srv.push({uuid:u,ts_evento:ev.ts,recibido:S.reloj,tipo:ev.tipo,kit:ev.kit});ev.estado='confirmado'}
 S.outbox=[]}
function pintarBarra(){$('reloj').textContent=textoReloj();$('red').textContent=S.online?'con senal':'SIN SENAL';const b=$('banner');
 if(S.outbox.length){b.classList.add('on');b.innerHTML=`${S.online?'Enviando':'Sin senal'}: <b data-t="pendientes">${S.outbox.length}</b> cambio(s) guardados en este telefono. ${S.online?'':'Se envian solos al volver la senal.'}`}else b.classList.remove('on')}
addEventListener('online',()=>{if(S){S.online=true;enviar();save();go(vista)}});addEventListener('offline',()=>{if(S){S.online=false;save();go(vista)}});

function numKit(k){return k.id.slice(-2)}
function listaKit(k){const rows=[];for(const m of k.modulos)for(const p of DEMO.piezas_mod[m]||[])rows.push({a:p.a.replace(/-01-/,'-'+numKit(k)+'-'),d:p.d,m});return rows}
function valorKit(k){return k.modulos.reduce((s,m)=>s+(DEMO.valor_modulo[m]||0),0)}
function tieneAsist(p,e,ts){const f=(S.asist[p]||{})[e];if(!f)return false;const hoy=fecha(ts),ayer=fecha(mas(hoy+'T12:00',-24));return f===hoy||f===ayer}
function ultAsistPlanta(p){const v=Object.values(S.asist[p]||{});return v.length?v.sort().slice(-1)[0]:null}

// ------------------------------------------------------------ alertas A1 a A7 (en produccion: cron n8n 7:00 y 19:00)
function alertas(){const out=[],t=S.reloj;
 for(const k of S.kits){const p=planta(k.planta);
  if(['EN_USO','RESGUARDADO'].includes(k.estado)&&k.planta!=='TALLER'){const ua=ultAsistPlanta(k.planta);const h=ua?habiles(ua+'T12:00',t):99;
   if(h>=2)out.push({a:'A1',kit:k.id,nivel:h>=5?'roja':'amarilla',txt:`Kit huerfano: nadie de FTS con asistencia en ${p.nombre} hace ${h} dias habiles (ultima ${ua||'nunca'})`,a_quien:h>=5?'Manager de operaciones':'Responsable + Supervisor SR'});
   if(['cierre','In Progress-parado'].includes(p.stage)||h>=10)out.push({a:'A2',kit:k.id,nivel:'roja',txt:`Proyecto parado: ${h} dias habiles sin asistencia en ${p.nombre}; pedir retiro o transferencia`,a_quien:'Supervisor SR'});
   const hr=habiles(k.ult_revision,t);const sinGente=h>=2;
   if(k.estado==='EN_USO'&&hr>=1)out.push({a:'A3',kit:k.id,nivel:hr>=2?'roja':'amarilla',txt:`Sin revision: ${hr} dia(s) habil(es)`,a_quien:hr>=2?'Supervisor SR':'Responsable'});
   if(k.estado==='RESGUARDADO'&&sinGente&&horas(k.ult_revision,t)>=24*7)out.push({a:'A3',kit:k.id,nivel:'amarilla',txt:`Resguardado sin gente y sin revision hace ${Math.floor(horas(k.ult_revision,t)/24)} dias`,a_quien:'Supervisor SR'})}
  if(['EN_TRANSITO','EN_TRANSFERENCIA'].includes(k.estado)&&k.desde){const h=horas(k.desde,t);if(h>=24)out.push({a:'A6',kit:k.id,nivel:h>=48?'roja':'amarilla',txt:`${k.estado} hace ${Math.floor(h)} h`,a_quien:'Quien entrega'})}
  if(k.combo_pendiente&&horas(k.combo_pendiente,t)>=24)out.push({a:'A5',kit:k.id,nivel:'amarilla',txt:'Combinacion sin cambiar 24 h despues de una rotacion',a_quien:'Supervisor SR'})}
 for(const f of S.faltantes.filter(f=>!f.cerrado)){const h=horas(f.ts,t);out.push({a:'A4',kit:f.kit,nivel:h>=24?'roja':'amarilla',txt:`Faltante ${f.a} (${f.d}) hace ${Math.floor(h)} h`,a_quien:h>=24?'Manager de operaciones':'Responsable + Supervisor'})}
 for(const ta of S.tareas.filter(x=>!x.resuelta)){const h=horas(ta.abierta,t);if(h>=24)out.push({a:'A7',kit:ta.kit,nivel:h>=48?'roja':'amarilla',txt:`Reasignacion abierta hace ${Math.floor(h)} h (${PER[ta.persona]})`,a_quien:h>=48?'Manager de operaciones':'Supervisor SR'})}
 return out}
function cron(){ // lo que haria el workflow de alertas: transferencias sin confirmar > 48 h pasan a EXTRAVIADO
 for(const k of S.kits)if(['EN_TRANSITO','EN_TRANSFERENCIA'].includes(k.estado)&&k.desde&&horas(k.desde,S.reloj)>=48){const a=k.estado;k.estado='EXTRAVIADO';registrar('A6: sin confirmar en 48 h, pasa a EXTRAVIADO',k,a,'EXTRAVIADO')}}

function kits(){const al=alertas();const abiertas=S.tareas.filter(t=>!t.resuelta);
 let h=abiertas.map(t=>`<div class="card" style="border-color:var(--bad)" data-t="tarea"><b>⚠ Reasignacion obligatoria</b><br>${esc(PER[t.persona])} cambio a ${esc(planta(t.nueva).nombre)} y tiene a su nombre ${t.kit} en ${esc(planta(kit(t.kit).planta).nombre)}.<div class="mut">Disparada por: ${t.disparadores.join(' + ')} · abierta ${t.abierta.replace('T',' ')}</div>${b('Resolver','go(\'reasignar\',\''+t.id+'\')','b','resolver')}</div>`).join('');
 for(const k of S.kits){const p=planta(k.planta);const ak=al.filter(a=>a.kit===k.id);const id=`'${k.id}'`;

  ${ak.map(a=>`<span class="chip ${a.nivel}">${a.a}</span> `).join('')}<div>`;
  if(k.estado==='EN_TALLER')h+=b('Preparar salida',`go('salida',${id})`)+b('Tomar este kit',`tomarKit(${id})`,'s','tomar-'+k.id);

  if(k.estado==='EN_USO')h+=b('Resguardar',`go('resguardo',${id})`)+b('Revisar',`go('rev',${id})`,'s')+b('Retirar',`go('retiro',${id})`,'s');

  <div class="tw"><table><tr><th>Kit</th><th>Estado</th><th>Dias habiles sin revision</th><th>Alertas</th></tr>${ks.map(k=>`<tr><td>${k.id}</td><td><span class="chip ${k.estado}">${k.estado}</span></td><td>${habiles(k.ult_revision,S.reloj)}</td><td>${al.filter(a=>a.kit===k.id).map(a=>`<span class="chip ${a.nivel}">${a.a}</span>`).join(' ')||'-'}</td></tr>`).join('')}</table></div></div>`}
 const trans=S.kits.filter(k=>!S.plantas.some(p=>p.id===k.planta));return h}
function vAlertas(){const al=alertas();if(!al.length)return '<div class="card">Sin alertas.</div>';
 return al.map(a=>`<div class="card" data-t="alerta-${a.a}"><div class="row"><span class="chip ${a.nivel}">${a.a}</span><b>${a.kit}</b><span class="sp"></span><span class="mut">a: ${esc(a.a_quien)}</span></div><div>${esc(a.txt)}</div></div>`).join('')}
function hist(){return `<div class="card"><div class="mut">Servidor (simulado): ${S.srv.length} eventos recibidos. Pendientes en el telefono: ${S.outbox.length}.</div><div class="tw"><table><tr><th>Hora del evento</th><th>Kit</th><th>Que</th><th>Estado</th><th>Envio</th></tr>
 ${S.eventos.map(e=>`<tr><td>${e.ts.replace('T',' ')}</td><td>${e.kit||'-'}</td><td>${esc(e.tipo)}${e.nota?'<br><span class=mut>'+esc(e.nota)+'</span>':''}</td><td>${e.antes&&e.antes!==e.despues?e.antes+' → '+e.despues:(e.despues||'')}</td><td class="${e.estado==='confirmado'?'conf':'pend'}" data-t="envio">${e.estado==='confirmado'?'confirmado':'pendiente'}</td></tr>`).join('')}</table></div></div>`}

function sim(){return `<div class="card"><h2>Reloj de la demo</h2><div data-t="reloj">${textoReloj()}</div>
 ${b('+1 h','avanzar(1)','s')}${b('+12 h','avanzar(12)','s')}${b('+24 h','avanzar(24)','s','mas24')}${b('+48 h','avanzar(48)','s','mas48')}${b('Martes 21:40','fijar(\'2026-09-29T21:40\')','s','martes')}</div>
 <div class="card"><h2>Senal</h2>${b(S.online?'Quitar senal':'Volver la senal','senal()','s','senal')}<div class="mut">Sin senal todo se guarda en el telefono con su hora real y se envia despues; el servidor ignora duplicados.</div></div>
 <div class="card"><h2>Plan nocturno</h2><label>Persona</label><select id="pp">${['e79','e6','e124'].map(e=>`<option value="${e}">${esc(PER[e])}</option>`).join('')}</select><label>Planta de manana</label><select id="pl2">${S.plantas.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>${b('Publicar plan','plan()','b','publicar-plan')}</div>
 <div class="card"><h2>Checada de kiosko</h2><label>Persona</label><select id="kp">${['e79','e6','e124'].map(e=>`<option value="${e}">${esc(PER[e])}</option>`).join('')}</select><label>Planta</label><select id="kpl">${S.plantas.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>${b('Checar entrada hoy','checar()','b','checar')}</div>
 <div class="card">${b('Reiniciar demo','reset()','s','reset')}</div>`}
function avanzar(h){S.reloj=mas(S.reloj,h);cron();save();go('sim')}function fijar(t){S.reloj=t;save();go('sim')}
function senal(){S.online=!S.online;if(S.online)enviar();save();go('sim')}
function plan(){abrirTarea($('pp').value,$('pl2').value,'plan nocturno');save();go('kits')}
function checar(){const e=$('kp').value,p=$('kpl').value;S.asist[p]=S.asist[p]||{};S.asist[p][e]=fecha(S.reloj);registrar('Checada de kiosko (x_studio_project_id)',null,'','',{nota:PER[e]+' en '+planta(p).nombre});abrirTarea(e,p,'kiosko');save();go('kits')}
load();if(!navigator.onLine)S.online=false;go('kits');

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nómina · Incidencias — FTS Suite</title>
<link rel="stylesheet" href="css/nomina.css">
</head>
<body>

<div class="rh-topbar">
  <a class="volver" href="../index.html">← Volver a RH</a>
  <span class="t">Nómina · Incidencias</span>
  <span class="badge" id="ver-badge">V1.01</span>
  <span class="badge" id="modo-badge" title="">DEMO</span>
  <span class="sp"></span>
  <span class="quien" id="quien"></span>
  <button class="salir hid" id="salir">Salir</button>
</div>

<!-- ── Puerta ──
     El módulo NO se pinta sin sesión válida con scope nomina:write. La página vive en
     un repo público servido por GitHub Pages: sin puerta, el roster completo con
     puestos y montos quedaría legible por cualquiera con la URL. El scope se vuelve a
     comprobar en el server en cada webhook; esconder la pantalla no autoriza nada. -->
<div id="puerta" class="login">
  <h1>Nómina · Incidencias</h1>
  <div class="sub">Entra con tu usuario del Suite. Necesitas permiso <b>nomina:write</b>.</div>
  <label for="u">Usuario</label>
  <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label for="p">Contraseña</label>
  <input id="p" type="password" autocomplete="current-password">
  <button class="btn pri" id="entrar">Entrar</button>
  <div id="login-err" class="err hid"></div>
</div>

<!-- ── Aplicación ── -->
<div class="wrap hid" id="app">

  <div class="cab">
    <div>
      <h1>Semana <span id="semana-id">—</span></h1>
      <div class="rango" id="semana-rango">—</div>
    </div>
    <span class="sp"></span>
    <button class="btn pri" id="enviar" disabled>Enviar a Nóminas FTS</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="banner"></div>

  <section id="p1">
    <div class="filtros" id="filtros"></div>
    <div class="tabla-wrap">
      <table>
        <thead><tr>
          <th></th><th>Persona</th><th>Días</th><th>Declarado</th><th>Dinero</th><th>Estado vigente</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="pie">Haz clic en cualquier renglón para capturar. El renglón queda en rojo mientras algo le falte.</div>
  </section>

  <section id="p2" class="hid"></section>
  <section id="p3" class="hid"></section>

  <div class="pie" id="pie-modo"></div>
</div>

<!-- ── Cajón de captura por persona ── -->
<div class="drawer" id="drawer">
  <div class="dpanel">
    <div class="dhead">
      <h2 id="dnom">—</h2>
      <button class="x" id="dx" aria-label="Cerrar">✕</button>
      <div class="sub" id="dsub">—</div>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dact"><button class="btn pri" id="dcerrar">Listo</button></div>
  </div>
</div>

<script src="js/catalogo.js"></script>
<script src="js/logica.js"></script>
<script src="js/nom-auth.js"></script>
<script src="js/nom-client.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  function mostrarError(msg) {
    var e = $('login-err');
    e.textContent = msg;
    e.className = 'err';
  }

  async function arrancar() {
    var s = window.NomAuth.getSession();
    $('puerta').className = 'login hid';
    $('app').className = 'wrap';
    $('salir').className = 'salir';
    $('quien').textContent = (s && (s.nombre || s.user)) || '';

    var pie = $('pie-modo');
    pie.innerHTML = window.NomClient.modo() === 'demo'
      ? 'Modo <b>DEMO</b>: los datos son de demostración sobre el roster real de Odoo. <b>Nada de lo que captures se guarda.</b>'
      : 'Modo <b>REAL</b>: conectado a los endpoints de producción.';

    try {
      var estado = await window.NomClient.cargarSemana(null);
      window.NomApp.montar(estado);
    } catch (err) {
      $('banner').innerHTML = '<div class="banner bad"><span class="ico">⛔</span><div>' +
        '<h3>No se pudo cargar la semana</h3><div style="font-size:13px">' +
        (err && err.msg ? err.msg : 'Error desconocido') + ' (' + (err && err.code ? err.code : '—') + ')</div></div></div>';
    }
  }

  // Fetch de la versión para el badge: si falla, el badge se queda con lo que trae el
  // HTML. Un badge que miente es peor que uno viejo, así que solo se pisa con un valor
  // leído de verdad.
  fetch('version.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (v) { if (v && v.version) $('ver-badge').textContent = v.version; })
    .catch(function () {});

  $('entrar').addEventListener('click', async function () {
    var b = $('entrar');
    b.disabled = true; b.textContent = 'Entrando…';
    var r = await window.NomAuth.login($('u').value, $('p').value);
    b.disabled = false; b.textContent = 'Entrar';
    if (!r.ok) {
      mostrarError(r.msg);   // el server ya redacta el motivo, incluidos los minutos de bloqueo
      return;
    }
    if (!window.NomAuth.tieneScope(window.NomAuth.SCOPE_MODULO)) {
      mostrarError('Tu usuario entró, pero no tiene el permiso nomina:write. Pídeselo a Esteban.');
      window.NomAuth.logout();
      return;
    }
    arrancar();
  });

  $('p').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') $('entrar').click(); });

  $('salir').addEventListener('click', function () {
    window.NomAuth.logout();
    location.reload();
  });

  if (window.NomAuth.isValid() && window.NomAuth.tieneScope(window.NomAuth.SCOPE_MODULO)) arrancar();
})();
</script>
</body>
</html>

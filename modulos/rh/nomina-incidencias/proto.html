*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);

.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:14px;white-space:nowrap}
.top .build{font-size:10px;color:var(--muted);font-weight:400}
.demo{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange);border-radius:5px;padding:2px 7px}
.spacer{flex:1}
.steps{display:flex;gap:3px;background:var(--border2);padding:3px;border-radius:9px}
.steps button{border:0;background:transparent;color:var(--muted2);padding:5px 13px;border-radius:7px;font-size:13px;font-weight:600}
.steps button[aria-current="true"]{background:var(--card);color:var(--green);box-shadow:var(--shadow)}
.send{border:0;border-radius:9px;padding:8px 15px;font-weight:700;font-size:13px;color:#fff;background:var(--green)}
.send[disabled]{background:var(--border);color:var(--muted);cursor:not-allowed}

main{max-width:1180px;margin:0 auto;padding:16px;padding-bottom:70px}
.banner{border-radius:12px;padding:13px 15px;margin-bottom:16px;border:1px solid;display:flex;gap:11px;align-items:flex-start}
.banner.bad{background:var(--red-soft);border-color:var(--red)}
.banner.ok{background:var(--green-soft);border-color:var(--green)}
.banner h3{margin:0 0 5px;font-size:14px}
.banner.bad h3{color:var(--red)} .banner.ok h3{color:var(--green)}
.banner ul{margin:5px 0 0;padding-left:17px;font-size:13px;color:var(--muted2)}
.banner li{margin:2px 0}
.banner .ico{font-size:19px;line-height:1.2}

.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipf{border:1px solid var(--border);background:var(--card);color:var(--muted2);
  border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:600}
.chipf[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.chipf .n{opacity:.65;margin-left:4px}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tw{overflow-x:auto;border-radius:12px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
td{padding:10px 13px;border-bottom:1px solid var(--border2);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--green-soft)}
td.st{width:5px;padding:0}
.nm{font-weight:600}
.rol{font-size:11.5px;color:var(--muted);margin-top:1px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-bad{background:var(--red-soft);color:var(--red)}
.p-warn{background:var(--orange-soft);color:var(--orange)}
.p-none{background:var(--border2);color:var(--muted)}
.p-info{background:var(--blue-soft);color:var(--blue)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

.drawer{position:fixed;inset:0;background:rgba(10,20,10,.42);display:none;z-index:60}
.drawer[open]{display:block}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);
  overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.dhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;z-index:2}
.dhead h2{margin:0;font-size:18px}
.dhead .sub{font-size:12.5px;color:var(--muted2);margin-top:2px}
.x{position:absolute;right:13px;top:13px;border:1px solid var(--border);background:var(--card);
  color:var(--muted2);border-radius:8px;width:29px;height:29px;font-size:15px;line-height:1}
.dbody{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.box h4{margin:0 0 9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.calc{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px}
.calc .v{text-align:right;font-weight:600}
.calc .tot{border-top:1px solid var(--border);padding-top:6px;margin-top:3px;font-weight:700}
.rowit{border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;background:var(--card)}
.rowit .rh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rowit .rt{font-weight:600;font-size:13.5px}
.rowit .rd{font-size:12px;color:var(--muted2);margin-top:3px}
.derv{font-size:11.5px;color:var(--blue);margin-top:5px;background:var(--blue-soft);

.del{border:0;background:transparent;color:var(--red);font-size:12px;font-weight:600;padding:2px 5px}
.add{width:100%;border:1px dashed var(--border);background:transparent;color:var(--green);

label{display:block;font-size:11.5px;font-weight:600;color:var(--muted2);margin:9px 0 3px}
select,input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;

.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.grp:first-child{border-top:0;padding-top:0;margin-top:0}
.dact{display:flex;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--card);position:sticky;bottom:0}
.btn{border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}

.hid{display:none !important}

function emp(id){for(var i=0;i<EMP.length;i++)if(EMP[i].id===id)return EMP[i];return null}
function rubro(e){return e.d!=='Operaciones'?null:(SUP.indexOf(e.j)>=0?'4.1 Bono Supervisores':'4.2 Bono Técnicos')}
function decl(id){return DECL[id]||(DECL[id]=[])}
function ests(id){return ESTADOS[id]||(ESTADOS[id]=[])}

function cuenta(id){
  var r={mx:0,usa:0,vac:0,falta:0},L=decl(id);
  for(var i=0;i<L.length;i++){var d=L[i];
    if(d.t==='_mx'){r.mx+=Number(d.v.dias)||0;continue}
    var mm=meta(d.t); if(!mm||!mm.m.cuenta)continue;
    r[mm.m.cuenta]+=Number(d.v.dias)||0;
  }
  r.total=r.mx+r.usa+r.vac+r.falta; r.ok=(r.total===SEMANA.dias); return r;
}
function probs(e){
  var p=[];
  if(e.baja){ if(!decl(e.id).length) return p; }
  var c=cuenta(e.id);
  if(!e.baja&&!c.ok) p.push({k:'dias',t:'Los días no suman '+SEMANA.dias+': van '+c.total});
  var L=decl(e.id);
  for(var i=0;i<L.length;i++){var d=L[i],mm=meta(d.t);if(!mm)continue;
    if(mm.m.multi){var R=d.v.renglones||[];
      for(var k=0;k<R.length;k++){
        if(!R[k].so) p.push({k:'bono',t:'Bono de $'+fmt(R[k].monto)+' sin proyecto asignado'});
        if(!(Number(R[k].monto)>0)) p.push({k:'bono',t:'Renglón de bono sin monto'});
      }
      if(!d.fuente) p.push({k:'bono',t:'Bono sin fuente de pago'});
    } else if(mm.m.fuente&&!d.fuente) p.push({k:'fuente',t:mm.m.l+' sin fuente de pago'});
  }
  for(var j=0;j<DISPUTAS.length;j++) if(DISPUTAS[j].emp===e.id&&DISPUTAS[j].ab)
    p.push({k:'disputa',t:'Checada en disputa del '+DISPUTAS[j].f});
  return p;
}
function fmt(n){n=Number(n)||0;return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function resumen(d,mm){
  var p=[];
  if(mm.m.multi){var R=d.v.renglones||[];for(var i=0;i<R.length;i++)p.push('$'+fmt(R[i].monto)+(R[i].so?' → '+R[i].so:' → SIN PROYECTO'));return p.join(' · ')}
  for(var i=0;i<mm.m.f.length;i++){var f=mm.m.f[i],v=d.v[f[0]];
    if(v===undefined||v===''||v===false)continue;
    p.push(f[1]+': '+(v===true?'sí':(f[2]==='num'&&f[0]!=='dias'&&f[0]!=='horas'&&f[0]!=='pago'?'$'+fmt(v):v)));}
  return p.join(' · ')||'—';
}

    f.v.dias=Number(ev.target.value)||0;
    var c=cuenta(ACT),cal=document.querySelector('.calc');
    if(cal){cal.children[1].textContent=c.mx;
      var tt=cal.querySelector('.v.tot');tt.textContent=c.total+' / '+SEMANA.dias;
      tt.style.color=c.ok?'var(--green)':'var(--red)';}
    refrescar();}
});
refrescar();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeación Operativa — FTS Suite</title>
<script>
  // PL_BUILD = el build del CÓDIGO que está corriendo. Debe ser idéntico a
  // version.json.build y al ?v= de cada <script>/<link> de abajo (lo exige
  // tests/visual-planeacion.js). Al bumpear, se cambian los tres juntos.
  window.PL_BUILD = '20260924-planeacion-deps-check';
  window.BUILD_DATE = window.PL_BUILD;
</script>
<!-- Primero que todo: escucha qué archivo no cargó (incidente 24-sep-2026) -->
<script src="../../shared/deps-check.js?v=20260924-planeacion-deps-check"></script>
<link rel="stylesheet" href="css/planeacion.css?v=20260924-planeacion-deps-check">
<script src="../../shared/auth-suite.js?v=20260924-planeacion-deps-check"></script>
</head>
<body>

<!-- Topbar inline (patrón mi-perfil/panel-incidencias) -->
<div class="pl-topbar">
  <a class="pl-back" href="../index.html">← Operaciones</a>
  <div class="pl-title-wrap">
    <span class="pl-title">📅 Planeación Operativa</span>
    <span class="pl-build" id="pl-build">build …</span>
  </div>
  <div class="pl-user">
    <span id="pl-user-nombre">—</span>
  </div>
</div>

<!-- Auth gate (visible si la sesión no tiene permiso) -->
<div id="auth-gate" class="pl-gate" style="display:none"></div>

<!-- Main content (oculto hasta auth OK) -->
<main id="main-content" class="pl-main" style="display:none">

  <!-- TODO F2: header + navegador de fechas -->
  <div id="header-zone"></div>

  <!-- TODO F2: banner de jornada total -->
  <div id="jornada-banner"></div>

  <!-- TODO F2: banner de progreso confirmación -->
  <div id="progreso-banner"></div>

  <!-- Lista de empleados (poblada por PlaneacionApp.renderLista) -->
  <div id="empleados-zone">
    <div class="pl-placeholder">⏳ Cargando empleados…</div>
  </div>

  <!-- TODO F3: zona de exportación -->
  <div id="export-zone"></div>

</main>

<!-- Modal edición individual (TODO F2) -->
<div id="modal-editar" class="pl-modal" style="display:none"></div>

<!-- Modal jalar externo (TODO F2) -->
<div id="modal-jalar" class="pl-modal" style="display:none"></div>

<!-- html2canvas para generar PNG (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Scripts (orden importante). ?v= = build: el index nuevo nunca convive con un JS viejo en caché -->
<script src="js/sitios.js?v=20260924-planeacion-deps-check"></script>
<script src="js/proyectos.js?v=20260924-planeacion-deps-check"></script>
<script src="js/config.js?v=20260924-planeacion-deps-check"></script>
<script src="js/horarios-base.js?v=20260924-planeacion-deps-check"></script>
<script src="js/empleados.js?v=20260924-planeacion-deps-check"></script>
<script src="js/jornada.js?v=20260924-planeacion-deps-check"></script>
<script src="js/turnos.js?v=20260924-planeacion-deps-check"></script>
<script src="js/exportar.js?v=20260924-planeacion-deps-check"></script>
<script src="js/planeacion.js?v=20260924-planeacion-deps-check"></script>

<!-- Chequeo de arranque: si falta un archivo, banner rojo que lo nombra -->
<script>
  (function(){
    var REQUERIDOS = [
      { global: 'FTSAuth',              archivo: 'shared/auth-suite.js' },
      { global: 'html2canvas',          archivo: 'html2canvas (cdnjs, para el PNG)' },
      { global: 'PLANEACION_SITIOS',    archivo: 'js/sitios.js' },
      { global: 'PLANEACION_PROYECTOS', archivo: 'js/proyectos.js' },
      { global: 'PLANEACION_CONFIG',    archivo: 'js/config.js' },
      { global: 'PLANEACION_HORARIOS',  archivo: 'js/horarios-base.js' },
      { global: 'PLANEACION_EMPLEADOS', archivo: 'js/empleados.js' },
      { global: 'PLANEACION_JORNADA',   archivo: 'js/jornada.js' },
      { global: 'PLANEACION_TURNOS',    archivo: 'js/turnos.js' },
      { global: 'PLANEACION_EXPORTAR',  archivo: 'js/exportar.js' },
      { global: 'PLANEACION_APP',       archivo: 'js/planeacion.js' }
    ];
    if (window.FTSDeps) {
      window.PL_DEPS = window.FTSDeps.verificar({ modulo: 'Planeación', build: window.PL_BUILD, requeridos: REQUERIDOS });
      return;
    }
    // Respaldo: el que no llegó es el propio shared/deps-check.js.
    var faltan = ['shared/deps-check.js'];
    for (var i = 0; i < REQUERIDOS.length; i++) {
      if (typeof window[REQUERIDOS[i].global] === 'undefined') faltan.push(REQUERIDOS[i].archivo);
    }
    var d = document.createElement('div');
    d.className = 'fts-deps-banner';
    d.setAttribute('role', 'alert');
    d.style.cssText = 'position:sticky;top:0;z-index:10000;background:#b42318;color:#fff;padding:12px 16px;font:14px/1.45 Arial,sans-serif';
    d.textContent = '⚠️ Planeación: no cargaron ' + faltan.join(', ') + '. Recarga la página con Ctrl+Shift+R.';
    document.body.insertBefore(d, document.body.firstChild);
    window.PL_DEPS = { ok: false, faltantes: faltan };
  })();
</script>

<!-- Build indicator: muestra el build del CÓDIGO (PL_BUILD), no el de version.json.
     Hasta 2026-09 pintaba version.json leído en vivo, y eso no probaba qué JS corría.
     Si version.json ya trae otro build, avisa que hay versión nueva (sin recargar solo:
     un reload a media captura perdería el plan que no se ha publicado). -->
<script>
  (function(){
    var el = document.getElementById('pl-build');
    if (el) el.textContent = 'build ' + window.PL_BUILD;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.build || d.build === window.PL_BUILD || !el) return;
        el.textContent = 'build ' + window.PL_BUILD + ' · hay versión nueva (' + d.build + '): recarga con Ctrl+Shift+R';
        el.classList.add('pl-build-viejo');
      })
      .catch(function(){});
  })();
</script>

</body>
</html>

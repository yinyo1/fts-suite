<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FTS Suite · Machote y órdenes</title>
<link rel="stylesheet" href="../../shared/fts-styles.css" />
<!-- Gate. Va aquí arriba, antes de pintar nada: si no hay sesión, el libro no
     debe alcanzar a verse. Ojo: esto decide si se PINTA, no si se descarga —
     Pages es público. Lo explica `shared/auth-jwt.js`. -->
<script src="../../shared/auth-jwt.js"></script>
<script>if (!window.SuiteAuth.requerir('comercial:read', '../login.html')) { throw new Error('sin sesion'); }</script>
<link rel="stylesheet" href="css/machote.css" />
</head>
<body>

<div class="scr on ancho" id="scr">
  <!-- La topbar va DENTRO del contenedor para que comparta su ancho: fuera,
       en escritorio abarcaba toda la ventana mientras el contenido iba centrado. -->
  <div class="topbar">
    <button class="tb-back" id="btnBack" aria-label="Volver">&#8249;</button>
    <div class="tb-logo" role="img" aria-label="FTS"></div>
    <div class="tb-info"><strong id="tbT">Machote y órdenes</strong><span id="tbS">Comercial · prototipo</span></div>
    <!-- El pulso del autoguardado. Va en la topbar a proposito: es el unico
         lugar que sigue visible en toda pantalla del libro. -->
    <div class="pulso" id="pulso" title="Autoguardado"><i></i><span id="pulsoTx">—</span></div>
    <button class="tb-user" id="tbUser" type="button" title="Cerrar sesión"></button>
    <div class="tb-badge" id="tbB">DEMO</div>
  </div>
  <main id="vista"></main>
  <div id="fija"></div>
</div>

<!-- calc.js primero: demo.js lee de el los roles y los margenes de plantilla. -->
<script src="js/almacen.js"></script>
<script src="js/calc.js"></script>
<script src="js/demo.js"></script>
<script src="js/reglas.js"></script>
<script src="js/pegar.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FTS Suite · Machote y órdenes</title>
<link rel="stylesheet" href="../../shared/fts-styles.css" />
<!-- Gate. Va aquí arriba, antes de pintar nada: si no hay sesión, el libro no
     debe alcanzar a verse. Ojo: esto decide si se PINTA, no si se descarga —
     Pages es público. Lo explica `shared/auth-jwt.js`. -->
<script src="../../shared/auth-jwt.js"></script>
<script>if (!window.SuiteAuth.requerir('comercial:read', '../login.html')) { throw new Error('sin sesion'); }</script>
<link rel="stylesheet" href="css/machote.css?v=V1.27" />
<!-- ⚠️ LA VERSIÓN VA EN LA URL DE CADA ARCHIVO, y no es cosmético.
     GitHub Pages sirve TODO con `Cache-Control: max-age=600` (medido el
     10-sep, ejecución 94341), y sin versión en la URL cada archivo se
     cachea por su cuenta: un navegador puede acabar con `app.js` de una
     versión y `calc.js` de otra, y entonces el pie describe la MITAD de
     lo que corre. Con la versión en la URL, un `index.html` dado pide
     siempre un juego COHERENTE: o todo viejo, o todo nuevo.
     Al bumpear la versión hay que bumpear estos `?v=` — y hay una prueba
     que falla si no coinciden con `const VERSION` y con `version.json`. -->
</head>
<body>

<div class="scr on ancho" id="scr">
  <!-- La topbar va DENTRO del contenedor para que comparta su ancho: fuera,
       en escritorio abarcaba toda la ventana mientras el contenido iba centrado. -->
  <!-- ENCABEZADO V1.21. Una sola línea de 52 px.
       La jerarquía es por TAMAÑO y PESO, no por cajas: el nombre de la
       pantalla en 15/600 y el rastro al lado en 12 gris, no debajo. Antes
       ocupaba todo el ancho sin jerarquía y cargaba una insignia «DEMO» que
       ya era falsa —la pantalla guarda en un servidor de verdad—; etiquetar
       de mentiras algo que funciona enseña a no creerle a las etiquetas.
       El botón de volver ya no es decorativo: en la lista sale del módulo. -->
  <div class="topbar">
    <a class="tb-back" id="btnBack" href="../index.html" aria-label="Volver">&#8249;</a>
    <div class="tb-info"><strong id="tbT">Machotes</strong><span id="tbS">Comercial</span></div>
    <!-- El pulso del autoguardado. Va aquí a proposito: es el unico
         lugar que sigue visible en toda pantalla del libro. -->
    <div class="pulso" id="pulso" title="Autoguardado"><i></i><span id="pulsoTx">—</span></div>
    <button class="tb-user" id="tbUser" type="button" title="Cerrar sesión"></button>
    <!-- La versión se queda en la barra, muy discreta. Al compactar el
         encabezado se cayó, y Esteban verifica EN PANTALLA que su cambio se
         desplegó (CLAUDE.md §8): dejarla sólo en el pie de la lista la
         escondía en las demás pantallas. Cinco caracteres. -->
    <span class="tb-ver" id="tbV" title="Versión del módulo"></span>
  </div>
  <main id="vista"></main>
  <div id="fija"></div>
</div>

<!-- calc.js primero: demo.js lee de el los roles y los margenes de plantilla. -->
<script src="js/sesion.js?v=V1.27"></script>
<script src="js/almacen.js?v=V1.27"></script>
<script src="js/calc.js?v=V1.27"></script>
<script src="js/geo.js?v=V1.27"></script>
<script src="js/demo.js?v=V1.27"></script>
<script src="js/reglas.js?v=V1.27"></script>
<script src="js/pegar.js?v=V1.27"></script>
<script src="js/clientes.js?v=V1.27"></script>
<script src="js/respaldo.js?v=V1.27"></script>
<script src="js/historial.js?v=V1.27"></script>
<script src="js/prestamo.js?v=V1.27"></script>
<script src="js/control.js?v=V1.27"></script>
<script src="js/cotizacion.js?v=V1.27"></script>
<script src="js/orden.js?v=V1.27"></script>
<script src="js/app.js?v=V1.27"></script>
<!-- El vigilante de versión del kiosko, tal cual: compara `version.json`
     contra lo que corre y, si el navegador quedó con un bundle viejo,
     recarga UNA vez. Escrito en su día por esta misma causa; el módulo
     comercial no lo había adoptado. Va al final: necesita `MACHOTE_BUILD`,
     que publica `app.js`. -->
<script src="../../shared/version-check.js?v=V1.27"></script>
<script>if (window.FTSVersionCheck && window.MACHOTE_BUILD) {
  FTSVersionCheck.run({ versionUrl: 'version.json', localBuild: window.MACHOTE_BUILD, tag: 'machote' });
}</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<!-- V1.41 · en iPhone los avisos solo llegan con la app en inicio y abierta como app (no en Safari): para eso el manifiesto. -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Conceptualizador" />
<link rel="apple-touch-icon" href="icono-180.png" />
<title>FTS Suite · Conceptualizador</title>
<script src="../../shared/auth-jwt.js"></script>
<script>if (!window.SuiteAuth.requerir('conceptualizador:usar', '../../shared/login.html')) { throw new Error('sin sesion'); }</script>
<style>
  /* V1.31 · look del prototipo aprobado (fts-conceptualizador prototipos/chat-v2.html, #4).
   * La barra de la suite NO va dentro del módulo: la ← de la lista regresa a la suite.
   * No se carga shared/fts-styles.css: sus nombres (.toast) chocan con los de aquí (§20 #12)
   * y su fuente pisaría la del sistema. Las variables que usan las tarjetas se definen aquí. */
  :root{
    --fondo:#efeae2; --sup:#ffffff; --sup2:#f6f5f3; --linea:#e7e3dd; --texto:#111b21; --sec:#667781; --ter:#8696a0;
    --acento:#1daa61; --acento-osc:#008069; --sale:#d9fdd3; --entra:#ffffff; --azul:#53bdeb; --aviso:#fff3c4; --rojo:#d13438;
    --sombra:0 1px .5px rgba(11,20,26,.13); --radio:18px; --cab:52px; --pie:env(safe-area-inset-bottom, 0px);
    /* lo que usan las tarjetas, el modal y cz-acciones.js */
    --wa-osc:#0b5d4b; --wa-teal:#008069; --green:#1f7a3a; --red:#d13438; --border:#e0e0e0; --d3:#f5f5f5; --d4:#ebebeb;
    --text:#111b21; --muted:#8696a0; --muted2:#667781; --o:#D83B01;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--sup);color:var(--texto);font-family:Roboto,"Google Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}
  .ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ico.s{width:20px;height:20px}.ico.xs{width:16px;height:16px}

  /* ── marco: una columna en el teléfono, dos desde 900 px ── */
  .app{display:flex;height:100vh;height:100dvh;max-width:1400px;margin:0 auto;background:var(--sup)}
  #lista{width:100%;display:flex;flex-direction:column;min-width:0;background:var(--sup);position:relative}
  .chat{display:none;flex-direction:column;width:100%;min-width:0;background:var(--fondo);position:relative}
  .app.ver-chat #lista{display:none}.app.ver-chat .chat{display:flex}

  /* ── encabezados delgados (52 px) con la versión ── */
  .cab{height:var(--cab);display:flex;align-items:center;gap:4px;padding:0 4px 0 6px;background:var(--sup);border-bottom:1px solid var(--linea);flex-shrink:0}
  .cab .tit{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding-left:6px}
  .cab .tit b{font-size:19px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab .tit input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;background:transparent;padding:6px 0}
  .ver{font-size:10.5px;font-weight:600;color:var(--sec);border:1px solid var(--linea);border-radius:8px;padding:0 6px;line-height:16px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .btn-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3b4a54;flex-shrink:0}
  .btn-ic:active,.btn-ic:hover{background:rgba(11,20,26,.06)}
  #ch{gap:2px;padding-right:2px}
  #ch .av{width:36px;height:36px;font-size:13px;margin-right:6px}
  #ch .tx{flex:1;min-width:0;line-height:1.15}
  #ch .tx b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
  #ch .tx b span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ch .tx small{display:block;font-size:12.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ch .tx small.vivo{color:var(--acento-osc);font-weight:500}

  /* ── lista ── */
  .chips{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;height:32px;border-radius:16px;padding:0 12px;background:var(--sup2);color:#3b4a54;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .chip b{font-weight:600;color:var(--sec);font-size:12px}
  .chip.on{background:#d9fdd3;color:#0a5c3c}.chip.on b{color:#0a5c3c}
  .chip .ini{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
  .chip-av{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chips .sep{width:1px;background:var(--linea);margin:6px 2px;flex-shrink:0}
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:84px}
  .fila-arch{display:flex;align-items:center;gap:18px;padding:10px 20px;font-size:15px;font-weight:500;color:#3b4a54;width:100%;text-align:left}
  .fila-arch .n{margin-left:auto;font-size:12.5px;color:var(--acento-osc);font-weight:600}
  .nota-arch{margin:6px 16px 10px;font-size:12.5px;color:var(--sec);background:var(--sup2);border-radius:10px;padding:8px 12px}
  .ses{display:flex;gap:12px;padding:10px 6px 10px 14px;align-items:center;min-height:72px;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
  .ses:hover{background:#f5f6f6}.ses.on{background:#f0f2f5}.ses.presion{background:#e9edef}
  .av{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:16px}
  .ses .tx{flex:1;min-width:0;border-bottom:1px solid var(--linea);padding-bottom:10px;margin-bottom:-10px}
  .ses .t{display:flex;align-items:center;gap:6px}
  .ses .t span.n{flex:1;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ses .h{font-size:12px;color:var(--sec);flex-shrink:0}.ses .h.nuevo{color:var(--acento);font-weight:600}
  .ses .u{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--sec);margin-top:2px}
  .ses .u .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ses .meta{display:flex;align-items:center;gap:4px;flex-shrink:0;color:var(--ter)}
  .badge{min-width:20px;height:20px;border-radius:10px;background:var(--acento);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .quien-ses{font-size:11px;font-weight:600;color:var(--sec);background:var(--sup2);border-radius:6px;padding:0 5px;line-height:17px;flex-shrink:0}
  .est{font-size:10.5px;font-weight:600;border-radius:6px;padding:0 5px;line-height:17px;flex-shrink:0;white-space:nowrap}
  .est.enviada{background:#fff1d6;color:#8a5300}.est.cerrada{background:#e3f4e3;color:#1f6b1f}
  .est.archivada,.est.local{background:var(--sup2);color:var(--sec)}.est.abierta{background:#e7f6ee;color:var(--acento-osc)}
  .ses .mas{width:32px;height:40px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ter);flex-shrink:0}
  .vacio{padding:40px 24px;text-align:center;color:var(--sec);font-size:14px}
  .pie{padding:14px;text-align:center;font-size:12px;color:var(--ter)}.pie a{color:var(--acento-osc)}
  .fab{position:absolute;right:16px;bottom:calc(16px + var(--pie));height:56px;border-radius:16px;background:var(--acento);color:#fff;display:flex;align-items:center;gap:10px;padding:0 18px 0 16px;font-weight:600;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:5}

  /* ── chat ── */
  #senal{display:none;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;background:#fff3cd;color:#7a5b00;padding:6px 12px;border-bottom:1px solid #f0dfa6;flex-shrink:0}
  #senal button{border:1px solid #d9b95e;background:#fff;border-radius:12px;padding:4px 10px;font-size:12px;flex-shrink:0}
  #msgs{flex:1;overflow-y:auto;padding:8px 10px 10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background-color:var(--fondo);background-image:radial-gradient(rgba(11,20,26,.045) 1px,transparent 1.2px);background-size:22px 22px}
  .dia{text-align:center;margin:10px 0 6px}.dia span{background:#fff;color:var(--sec);font-size:12px;padding:5px 12px;border-radius:8px;box-shadow:var(--sombra);font-weight:500}
  .sis{text-align:center;margin:8px auto;max-width:88%}.sis span{background:var(--aviso);color:#54656f;font-size:12.5px;padding:6px 12px;border-radius:8px;display:inline-block;box-shadow:var(--sombra)}
  .fila{display:flex;margin:2px 0}.fila.yo{justify-content:flex-end}
  .fila.sig{margin-top:8px}
  .b{max-width:min(82%,520px);padding:6px 8px 6px 10px;border-radius:var(--radio);box-shadow:var(--sombra);position:relative;word-wrap:break-word;overflow-wrap:anywhere;background:var(--entra)}
  .b.yo{background:var(--sale)}.b.pend{opacity:.92}
  .fila.sig .b.yo{border-top-right-radius:6px}.fila.sig .b.el{border-top-left-radius:6px}
  .b .quien{font-size:12.5px;font-weight:600;color:var(--acento-osc);margin-bottom:1px}
  .b .txt{font-size:15px}.b.yo .txt{white-space:pre-wrap}
  .b .txt .li{padding-left:2px}.b .txt .h{font-weight:700;margin-top:4px}.b .txt .sp{height:6px}
  .b.el.intro{background:#fff8e1}
  .b .hora{float:right;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--sec);margin:6px 0 -2px 10px;position:relative;top:2px;white-space:nowrap}
  .b.yo .hora{color:#5d7a63}
  .tk{display:inline-flex;align-items:center;color:#8a9a8f}.tk svg{width:17px;height:11px}.tk.leido{color:var(--azul)}.tk.mal{color:var(--rojo)}
  .cola{color:#5d7a63;font-size:11px;display:inline-flex;align-items:center;gap:3px}.mal{color:var(--rojo)}.ok{color:var(--green)}
  .barra{height:3px;background:rgba(0,0,0,.08);border-radius:2px;margin:5px 0 2px;overflow:hidden}.barra i{display:block;height:100%;background:var(--acento-osc);transition:width .2s}
  /* fotos */
  .album{display:grid;gap:3px;border-radius:13px;overflow:hidden;margin:-2px -4px 4px -6px;width:260px;max-width:100%}
  .album.n1{grid-template-columns:1fr}.album.n2,.album.n3,.album.n4{grid-template-columns:1fr 1fr}
  .foto{aspect-ratio:1;background:#c9d2cc center/cover no-repeat;position:relative;cursor:pointer}
  .album.n1 .foto{aspect-ratio:4/3}.album.n3 .foto:first-child{grid-column:1/3;aspect-ratio:2/1}
  .foto .mas{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
  .foto .sube{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
  .pie-adj{font-size:11.5px;color:var(--sec);margin:0 0 3px}
  .doc{display:flex;gap:10px;align-items:center;background:rgba(11,20,26,.05);border-radius:10px;padding:9px;min-width:210px;max-width:100%;cursor:pointer;margin:2px 0}
  .doc .ic{width:34px;height:42px;background:#e53935;color:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
  .doc b{font-size:13.5px;display:block;word-break:break-all}.doc small{font-size:11.5px;color:var(--sec)}
  /* nota de voz */
  .voz{display:flex;align-items:center;gap:8px;width:min(300px,68vw);padding:2px 0 0}
  .voz .play{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#54656f;flex-shrink:0}
  .voz .play svg{width:28px;height:28px;fill:currentColor;stroke:none}
  .voz .cuerpo{flex:1;min-width:0}
  .onda{height:30px;display:flex;align-items:center;gap:2px;cursor:pointer;position:relative;touch-action:none;margin:0 4px}
  .onda i{flex:1;min-width:2px;max-width:3px;border-radius:2px;background:#b7c3bb;transition:background .1s}
  .onda i.ya{background:var(--acento-osc)}
  .b.yo .onda i{background:#a9c2ae}.b.yo .onda i.ya{background:#3b7d52}
  .onda .perilla{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--acento);box-shadow:0 1px 2px rgba(0,0,0,.25);pointer-events:none}
  .voz-pie{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sec);margin-top:1px;font-variant-numeric:tabular-nums}
  .vel{height:26px;min-width:44px;border-radius:13px;background:rgba(11,20,26,.08);font-size:12.5px;font-weight:600;color:#3b4a54;flex-shrink:0;padding:0 8px}
  .b.yo .vel{background:rgba(0,80,40,.10)}
  .trans{margin-top:6px;padding-top:6px;border-top:1px solid rgba(11,20,26,.08);font-size:14px;color:#2b3b33;line-height:1.38}
  .trans .et{display:block;font-size:11px;font-weight:600;color:var(--sec);letter-spacing:.2px;margin-bottom:1px}
  .trans.pend{color:var(--sec);font-style:italic;display:flex;align-items:center;gap:8px}
  .trans.mal{color:#9b2c2c;font-style:normal}
  .trans.dud{color:#7a4b00}.trans.dud .et{color:#9a5b00}
  .trans.trad{border-top:1px dashed rgba(11,20,26,.14);color:#2b3b33}.trans.trad .et{font-style:italic}
  .giro{width:14px;height:14px;border:2px solid #b7c3bb;border-top-color:var(--acento-osc);border-radius:50%;animation:giro .9s linear infinite;flex-shrink:0}
  @keyframes giro{to{transform:rotate(360deg)}}
  /* escribiendo: solo cuando el motor VA A CONTESTAR (1.4) */
  .escribe{display:inline-flex;gap:4px;align-items:center;padding:12px 14px;border-radius:var(--radio);border-top-left-radius:6px;background:var(--entra);box-shadow:var(--sombra)}
  .escribe i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:pt 1.3s infinite}
  .escribe i:nth-child(2){animation-delay:.18s}.escribe i:nth-child(3){animation-delay:.36s}
  .escribe em{font-style:normal;font-size:12.5px;color:#54656f;margin-left:6px}
  @keyframes pt{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* tarjetas del motor (conceptos, machote, BOM, botones) */
  .carta{background:#fff;border-radius:var(--radio);border-top-left-radius:6px;padding:10px 12px;margin:6px 0;max-width:min(94%,680px);box-shadow:var(--sombra)}
  .carta h4{font-size:13.5px;color:var(--wa-osc);margin-bottom:6px;font-weight:600}
  details.carta summary{cursor:pointer;font-size:13.5px;color:var(--wa-osc)}
  .preg{border-top:1px solid #eee;padding:8px 0}.preg:first-of-type{border-top:0}.preg p{font-size:14px}
  .conj{font-size:13px;color:#3b4a54;background:#f0f7f4;border-left:3px solid var(--acento-osc);padding:5px 8px;margin:5px 0;border-radius:0 8px 8px 0}
  .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.acc.der{justify-content:flex-end;margin-top:14px}
  .acc button,.boton{border:1px solid var(--acento-osc);background:#fff;color:var(--acento-osc);border-radius:18px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;min-height:36px;cursor:pointer}
  .acc button.si,.boton.si{background:var(--acento-osc);color:#fff}.acc button.no{border-color:#e0a1a1;color:var(--red)}
  .acc button:disabled,.boton:disabled{opacity:.5}
  .hecho{font-size:12.5px;font-weight:600;color:var(--green)}.hecho.mal{color:var(--red)}.hecho.gris,.gris{color:var(--muted2)}
  .corr{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
  .corr input{flex:1;border:1px solid #ccd;border-radius:16px;padding:7px 11px;font:inherit;font-size:16px;min-width:150px}
  .corr .err{font-size:12px;color:var(--red);flex-basis:100%}
  .con{display:flex;gap:8px;align-items:flex-start;border-top:1px solid #eee;padding:7px 0}.con:first-of-type{border-top:0}
  .con .n{font-size:11px;font-weight:800;color:var(--muted2);min-width:26px;padding-top:2px}
  .con .d{flex:1;font-size:13.5px;min-width:0}.con small{display:block;color:#667781;font-size:11.5px}
  .con .acc{margin-top:0;flex-wrap:nowrap}.con .acc button{min-width:38px;padding:6px 10px}
  .nota{font-size:12px;color:#667781;margin-top:6px}
  .tabla{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
  .tabla th{text-align:left;color:#667781;font-weight:600;padding:5px 4px;border-bottom:1px solid #e5e5e5}
  .tabla td{padding:5px 4px;border-bottom:1px solid #f0f0f0;vertical-align:top}
  .tabla .r{text-align:right;white-space:nowrap}.tot td{font-weight:800;border-top:2px solid #ddd}
  .bom{border-top:1px solid #eee;padding:7px 0;font-size:13px}.org{font-size:11.5px;color:#667781}.org a{color:var(--acento-osc)}
  .odoo{border:1px solid #e3e3e3;border-radius:8px;padding:8px;margin:6px 0;font-size:13px}
  .ol{padding-left:20px;font-size:14px}
  /* menú inicial de la sesión nueva (V1.30) */
  .app.en-menu .compose,.app.en-menu #fijo{display:none!important}
  .opciones{display:flex;flex-direction:column;gap:8px;margin:8px 0 6px}
  .opc{text-align:left;border:1px solid #cfe3dd;background:#fff;border-radius:12px;padding:11px 12px;cursor:pointer;min-height:48px}
  .opc b{display:block;font-size:15px;color:var(--wa-osc)}.opc small{display:block;color:#54656f;font-size:12.5px;margin-top:2px}
  .opc:hover{background:#f3faf8}
  .pais{font-size:12.5px;color:#54656f;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pais button{border:1px solid #cfd8d6;background:#fff;border-radius:14px;padding:5px 10px;font-size:12.5px}
  .pais button.on{background:var(--acento-osc);color:#fff;border-color:var(--acento-osc)}
  /* bandeja de adjuntos antes de mandar */
  #bandeja{display:none;padding:8px 10px 0;flex-shrink:0}
  .tira{display:flex;gap:6px;overflow-x:auto;padding:4px 4px}
  .mini{width:58px;height:58px;border-radius:10px;background:#cfd8dc center/cover no-repeat;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#555}
  .mini button{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;font-size:14px;line-height:1}
  #bandeja .nota{margin:2px 4px 0}
  #prep{display:none;font-size:12px;color:#667781;padding:4px 12px;flex-shrink:0}
  /* botón fijo del modo */
  #fijo{padding:6px 10px 0;display:none;justify-content:center;flex-shrink:0}
  #fijo button{height:40px;border-radius:20px;padding:0 18px;background:var(--sup);color:var(--acento-osc);font-weight:600;font-size:14.5px;box-shadow:var(--sombra);border:1px solid #cfe9db;display:flex;align-items:center;gap:8px}
  #fijo button:disabled{opacity:.6}

  /* V1.37 · franja de avance (prototipo aprobado, #4): fija bajo el encabezado, igual para todos */
  /* V1.40 · franja de avance en UNA línea (prototipo aprobado V1.39 · 1). Colapsada ~34 px; el detalle se abre ENCIMA
   * del chat (no lo empuja); ≥900 px es un panel lateral de 300 px siempre abierto (ver abajo). Prefijos avl- y rub-:
   * nombres nuevos, para no chocar con clases que ya significan otra cosa aquí (.barra, .hoja, .chips, .pie). */
  #avance{display:none;background:var(--sup);border-bottom:1px solid var(--linea);flex-shrink:0;position:relative;z-index:6;user-select:none;-webkit-user-select:none}

.bt .giro,.bt-envia .giro{width:14px!important;height:14px!important;min-width:0!important;flex:0 0 14px!important}
/* visor a pantalla completa: barras oscuras arriba y abajo que salen con un toque */
.czv{position:fixed;inset:0;z-index:200;background:#000;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.czv-pista{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.czv-pista img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;pointer-events:none}
.czv-cargando{color:#aebac1;font-size:14px}
.czv-arriba,.czv-abajo{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;background:rgba(17,27,33,.92);transition:transform .18s,opacity .18s;padding:0 8px}
.czv-arriba{top:0;height:56px;padding-top:env(safe-area-inset-top)}
.czv-abajo{bottom:0;justify-content:center;gap:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.czv:not(.barras) .czv-arriba{transform:translateY(-100%);opacity:0}
.czv:not(.barras) .czv-abajo{transform:translateY(100%);opacity:0}
.czv-bt{min-width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:6px;color:#e9edef;background:transparent;border:0;font:inherit;font-size:14px}
.czv-bt .ico{width:24px;height:24px;stroke:#e9edef}
.czv-bt.grande{padding:0 14px;border:1px solid #3b4a54}
.czv-tit{flex:1;min-width:0}.czv-tit b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.czv-tit small{display:block;font-size:12px;color:#aebac1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.czv-n{font-size:13px;color:#aebac1;flex-shrink:0;padding-right:6px}
.czv-descargar{height:48px;border-radius:24px;padding:0 22px;display:flex;align-items:center;gap:8px;background:#25d366;color:#0b141a;font:inherit;font-size:16px;font-weight:700;border:0}
.czv-descargar .ico{width:22px;height:22px;stroke:#0b141a;stroke-width:2.2}
.czv-lado{position:absolute;top:50%;margin-top:-24px;width:44px;height:48px;border-radius:24px;background:rgba(17,27,33,.55);color:#fff;font-size:30px;line-height:44px;border:0;display:none}
@media(min-width:900px){.czv.barras .czv-lado{display:block}}
.czv-lado.izq{left:10px}.czv-lado.der{right:10px}

.cza-bt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#54656f;background:transparent;border:0;flex-shrink:0}

.cza-mini{aspect-ratio:1/1;background:#dfe5e7 center/cover no-repeat;border:0;position:relative;padding:0}

.cza-doc.sel{background:#e7f6ee}
.cza-doc .cza-ok{position:static;flex-shrink:0}

.cza-dtx{flex:1;min-width:0}.cza-dtx b{display:block;font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.cza-dtx small{display:block;font-size:12px;color:var(--sec,#667781);margin-top:2px}

.cza-lic{width:40px;height:40px;border-radius:8px;background:#dfe5e7;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.cza-tarjeta b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.cza-tarjeta small{display:block;font-size:12px;color:var(--sec,#667781)}
.cza-tarjeta small.u{color:#027eb5;overflow-wrap:anywhere}
.cza-de{display:block;width:100%;text-align:left;font:inherit;font-size:13px;color:#3b4a54;background:transparent;border:0;padding:6px 2px 0;overflow-wrap:anywhere}
.cza-vacio{text-align:center;color:var(--sec,#667781);font-size:14px;padding:40px 16px}
/* precio web: tienda o sucursal, existencia y SKU */
.tienda{display:inline-block;font-size:11.5px;color:#3b4a54;background:#eef3f1;border-radius:6px;padding:0 6px;margin:2px 4px 0 0;line-height:18px}
.tienda.sin{color:#8a5300;background:#fff1d6}
a.fuente{color:var(--acento-osc);font-weight:600;text-decoration:none}

/* documento en una burbuja (igual que la suite) y mensaje al que lleva un enlace */
.b .doc{display:flex;gap:10px;align-items:center;background:rgba(11,20,26,.05);border-radius:10px;padding:9px;min-width:210px;max-width:100%;cursor:pointer;margin:2px 0}

.b .doc b{font-size:13.5px;display:block;word-break:break-all}.b .doc small{font-size:11.5px;color:var(--sec)}
.brilla{animation:brilla 1.6s}
@keyframes brilla{0%,60%{background:rgba(255,235,59,.35)}100%{background:transparent}}

  /* ═══ V1.32.1 · «Cotiza» fuera de la barra: junto a ⋮, lejos del micrófono y de la cámara (#4 A5) ═══ */

  /* V1.39 · punto 7: la oferta «¿me permites…?» (prototipo aprobado) */
  .of-carta .of-tiene{font-size:13px;color:var(--sec);line-height:1.45}.of-carta .of-tiene b{color:var(--tx,#111)}
  .of-carta .of-bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .of-carta .bt.of-gris{border-color:#c9cdd3;color:#555}
  .of-carta .of-est{margin-top:8px;font-size:13px;font-weight:600;color:var(--acento-osc)}.of-carta .of-est.of-esp{color:#8a5a00}
  .of-carta .caja-razon{margin-left:0}
  .of-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .of-chips button{border:1px solid #c9cdd3;background:#fff;border-radius:16px;padding:5px 10px;font:inherit;font-size:12.5px;color:#444}
  .of-chips button.on{background:var(--acento-osc);border-color:var(--acento-osc);color:#fff}
  .preg .caja-razon{margin-left:0}
  .caja-razon label{display:block;font-size:12px;font-weight:600;color:var(--sec);margin-bottom:4px}
  .caja-razon .lin{display:flex;gap:6px;align-items:flex-end}
  .caja-razon textarea{flex:1;min-width:0;border:1px solid #ccd;border-radius:12px;padding:8px 10px;font:inherit;font-size:16px;resize:none;min-height:44px;background:#fff}
  .mic-dict{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #ccd;color:#54656f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .caja-razon .estado{font-size:12px;color:var(--sec);margin-top:4px;min-height:16px;display:flex;align-items:center;gap:6px}
  .caja-razon .acc-r{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
  .pie-lote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--linea)}
  /* «escribiendo…» que se despliega con los pasos de ese trabajo (6a) */
  .escribe-b{display:inline-flex;flex-direction:column;align-items:stretch;border-radius:var(--radio);border-top-left-radius:6px;background:var(--entra);box-shadow:var(--sombra);max-width:min(88%,460px);text-align:left}
  .escribe-b .top{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .escribe-b .pts{display:inline-flex;gap:4px}
  .escribe-b .pts i{width:7px;height:7px;border-radius:50%;background:#8696a0;animation:pt 1.3s infinite}
  .escribe-b .pts i:nth-child(2){animation-delay:.18s}.escribe-b .pts i:nth-child(3){animation-delay:.36s}
  .escribe-b em{font-style:normal;font-size:13px;color:var(--sec);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .escribe-b .flecha{color:var(--ter);transition:transform .15s}.escribe-b.abierto .flecha{transform:rotate(180deg)}
  .escribe-b .pasos{display:none;border-top:1px solid var(--linea);padding:6px 12px 10px;font-size:13px}
  .escribe-b.abierto .pasos{display:block}
  .paso{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:#3b4a54}
  .paso .m{width:16px;flex-shrink:0;padding-top:1px;color:var(--acento-osc);display:flex;justify-content:center}
  .paso.ya{color:var(--sec)}.paso .pt-tx{flex:1;min-width:0}
  .paso .t{margin-left:auto;font-size:11px;color:var(--ter);font-variant-numeric:tabular-nums;flex-shrink:0}
  /* ir hasta abajo (como WhatsApp): arriba del micrófono, sin tapar la barra; no arrastra (6b) */
  .abajo{position:absolute;right:12px;width:44px;height:44px;border-radius:50%;background:var(--sup);color:#54656f;box-shadow:0 2px 6px rgba(11,20,26,.22);display:none;align-items:center;justify-content:center;z-index:5}
  .abajo.on{display:flex}.abajo .badge{position:absolute;top:-6px;right:-4px}
  /* botones fijos: el del modo, o crear / abrir el machote y pedir la cotización */
  #fijo{gap:8px;flex-wrap:wrap}
  /* el editor de machotes de siempre en ventana, y la vista en página */
  .panel{position:fixed;inset:0;z-index:120;display:none;background:rgba(11,20,26,.42)}
  .panel.on{display:block}
  .panel .marco{position:absolute;inset:0;background:var(--sup);display:flex;flex-direction:column}
  @media(min-width:900px){.panel .marco{inset:28px 4%;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}}
  .panel .cabp{height:52px;display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:1px solid var(--linea);flex-shrink:0}
  .panel .cabp b{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel .volver{height:36px;border-radius:18px;padding:0 14px 0 8px;display:flex;align-items:center;gap:4px;color:var(--acento-osc);font-weight:600;font-size:14px}
  .panel .cuerpo{flex:1;overflow:auto;background:#f4f5f7}
  .panel iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .pagina{padding:16px;max-width:900px;margin:0 auto;font-size:14px;background:#fff;min-height:100%}
  .pagina h2{font-size:20px;margin-bottom:2px}.pagina h3{font-size:15px;margin:16px 0 6px;color:var(--wa-osc)}
  .pagina .sub{color:var(--sec);font-size:12.5px;margin-bottom:10px}
  .pagina ins{background:#d9fdd3;text-decoration:none;padding:0 2px;border-radius:3px}
  .pagina del{background:#fde7e7;color:#9b2c2c;padding:0 2px;border-radius:3px}
  .pagina .tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .pagina .tabs button{height:32px;border-radius:16px;padding:0 12px;background:var(--sup2);font-size:13px;font-weight:600}
  .pagina .tabs button.on{background:#d9fdd3;color:#0a5c3c}
  .pagina .scroll-x{overflow-x:auto}.pagina table{min-width:560px}
  .pagina a{color:var(--acento-osc);font-weight:600;text-decoration:none}
  .tabla tr.cambio td{background:#fff3c4}
  /* empresa y moneda (menú inicial y ⋮), exportar, ficha */
  .emp-sel{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
  .emp-sel button{display:flex;align-items:center;gap:10px;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;text-align:left;font-size:14.5px}
  .emp-sel button.on{border-color:var(--acento-osc);background:#f0faf4}
  .emp-sel button .rad{width:18px;height:18px;border-radius:50%;border:2px solid #9aa7ae;flex-shrink:0}
  .emp-sel button.on .rad{border:5px solid var(--acento-osc)}
  .emp-sel button small{display:block;font-size:11.5px;color:var(--sec)}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}.chk input{width:auto}
  .ficha .fl{display:flex;gap:10px;padding:9px 0;font-size:14.5px;align-items:baseline;border-top:1px solid #f0f0f0}
  .ficha .fl span{color:var(--sec);min-width:96px;font-size:13px}
  .ficha .fl div{flex:1;min-width:0;overflow-wrap:anywhere}.ficha a{color:var(--acento-osc);font-weight:600;text-decoration:none}
  @media print{
    body.imprimiendo-pag>*:not(#panel){display:none!important}
    body.imprimiendo-pag .panel{position:static;background:#fff}
    body.imprimiendo-pag .panel .marco{position:static;box-shadow:none}
    body.imprimiendo-pag .cabp,body.imprimiendo-pag .tabs{display:none!important}
  }
  @media(min-width:900px){
    #lista{width:380px;flex-shrink:0;display:flex!important;border-right:1px solid var(--linea)}
    .chat{display:flex}
    #ch .vuelve{display:none}
    #msgs{padding:10px 6% 12px}
    .app:not(.ver-chat) .chat>*{display:none}
    .app:not(.ver-chat) .chat::before{content:'Elige una cotización o abre una nueva.';margin:auto;color:var(--sec);font-size:14px}
  }

  /* ═══ V1.48 (#4, prototipo aprobado el 16-oct): tabla del machote, BOM con filtros, globito del agente, anillo del avance ═══
   * Prefijos tb- (cz-tabla.js), bot-ag/pop-ag (globito), avl-anillo/avl-col (franja). La tabla y el BOM no usan .tabla ni .bom
   * (ya existen con otro significado, §20 #12). */
  .tb-carta{max-width:min(100%,760px)}
  .tb-arriba{font-size:13px;color:#3b4a54;margin:0 0 8px}
  .tb{width:100%;border-collapse:collapse;font-size:13px}
  .tb th{font-size:11.5px;font-weight:600;color:var(--sec);text-align:right;padding:4px 6px;border-bottom:1px solid var(--linea);white-space:nowrap}
  .tb th:first-child{text-align:left}
  .tb td{padding:6px;border-bottom:1px solid var(--linea);vertical-align:top}
  .tb td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tb .tb-ex{display:flex;gap:6px;align-items:flex-start;text-align:left;font-weight:600;font-size:13px;width:100%;color:var(--texto)}
  .tb .tb-ex[disabled]{cursor:default}.tb .tb-ex[disabled] .tb-chev{visibility:hidden}
  .tb .tb-ex.g{font-weight:500;padding-left:14px;color:#3b4a54}
  .tb .tb-ex small{color:var(--ter);font-weight:400}
  .tb-chev{color:var(--sec);font-size:11px;line-height:19px;display:inline-block;flex-shrink:0}
  .tb .tb-ex[aria-expanded="true"] .tb-chev{transform:rotate(90deg)}
  .tb tr.tb-g td,.tb tr.tb-rs td{background:var(--sup2)}
  .tb tr.tb-rs td{padding:0 4px 4px 18px}
  .tb tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--texto);padding-top:8px}
  .tb .mg{display:none;font-size:11px;color:var(--sec);font-weight:500}
  @media (max-width:520px){ .tb .mg4{display:none} .tb .mg{display:block} .tb{font-size:12.5px} .tb .tb-ex{font-size:12.5px} .tb td{padding:6px 4px} }
  /* V1.54 E2 (`machote_chat`): tabla de 3 columnas a cualquier ancho; decreto como marca corta; liga al popup. */
  .tb.tb3 th,.tb.tb3 td{display:table-cell}
  .tb.tb3 .tb-gn{display:block;padding-left:18px;color:#3b4a54;font-size:12.5px}
  .tb.tb3 .tb-n{min-width:0;overflow-wrap:anywhere}
  .tb-dec{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:8px;background:#e6f0fa;color:#2f6fb3;vertical-align:1px}
  .tb3-pie{margin:8px 0 0;text-align:right}.tb3-pie .link{font-size:13px;font-weight:600;color:var(--acento-osc)}
  @media (max-width:520px){ .tb.tb3{font-size:12px} .tb.tb3 td,.tb.tb3 th{padding:6px 3px} .tb.tb3 .tb-ex{font-size:12px} }
  .tb-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 6px;border-top:1px dashed var(--linea)}
  .tb-r:first-child{border-top:0}
  .tb-d{font-size:13px;min-width:0;overflow-wrap:anywhere}.tb-d small{display:block;font-size:12px;color:var(--sec);margin-top:2px}
  .tb-i{text-align:right;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}.tb-i small{display:block;font-size:11.5px;color:var(--sec)}
  .tb-meta{grid-column:1 / 3;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tb-tag{font-size:11.5px;padding:1px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
  .tb-tag.tu{background:var(--sup2);color:#3b4a54;border:1px solid var(--linea)}.tb-tag.ag{background:#eef1f3;color:#3b4a54}
  .tb-tag.n3{background:#fff3d6;color:#8a5a00}.tb-tag.n4{background:#e6f0fa;color:#2f6fb3}.tb-tag.n5{background:#fde7e7;color:var(--rojo)}
  .tb-tag.n1,.tb-tag.n2{background:#e3f6ea;color:#0b6b45}
  .tb-al{font-size:12px;color:#8a5a00;padding:2px 6px;border-radius:6px}
  .tb-cam{font-size:12.5px;font-weight:600;color:var(--acento-osc);padding:2px 6px;border-radius:6px}
  .tb-alerta{grid-column:1 / 3;display:none;font-size:12px;color:#8a5a00;background:#fff3d6;border-radius:6px;padding:4px 8px}
  .tb-r.ver-alerta .tb-alerta{display:block}
  .tb-bom{padding:0;overflow:hidden;max-width:min(100%,760px)}
  .tb-bh{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
  .tb-bt{flex:1;min-width:0}.tb-bt b{display:block;font-size:14px}.tb-bt span{display:block;font-size:12.5px;color:var(--sec)}
  .tb-bom.abierta .tb-bh .tb-chev{transform:rotate(180deg)}
  .tb-filtros{padding:8px 12px;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);background:var(--sup2)}
  .tb-chips{display:flex;gap:6px;flex-wrap:wrap}
  .tb-chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--linea);background:#fff;font-size:12.5px;font-weight:500}
  .tb-chip small{opacity:.75;margin-left:2px}.tb-chip.on{background:var(--acento-osc);border-color:var(--acento-osc);color:#fff}
  .tb-frow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--sec)}.tb-frow>span{flex:1}
  .tb-quitar{font-size:12.5px;font-weight:600;color:var(--rojo);padding:4px 8px;border-radius:6px}
  .tb-ley{font-size:12px;color:var(--sec);padding:6px 12px 0}
  .tb-sec{border-bottom:1px solid var(--linea)}.tb-sec:last-child{border-bottom:0}
  .tb-sh{display:flex;align-items:center;gap:8px;padding:10px 12px;width:100%;text-align:left}
  .tb-sn{flex:1;min-width:0}.tb-sn b{display:block;font-size:13.5px}.tb-sn>span{display:block;font-size:12px;color:var(--sec)}
  .tb-st{text-align:right;flex-shrink:0}.tb-st b{display:block;font-size:13.5px}.tb-st span{display:block;font-size:11.5px;color:var(--sec)}
  .tb-sec.abierta .tb-sh .tb-chev{transform:rotate(180deg)}.tb-sec.apagada .tb-sh{opacity:.5}
  .tb-cumplen{color:var(--acento-osc)}
  .tb-srs{padding:0 8px 8px}.tb-mo{font-size:12.5px;color:var(--sec);padding:6px 6px 2px;border-top:1px dashed var(--linea)}
  .tb-nueva{border:1px solid #bfe5cd}.tb-dif{font-size:13px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
  .txt-corto{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .ver-todo{font-size:12.5px;margin:2px 0 0}
  /* el globito del agente (V1.48). V1.52 §15: solo se pinta con el interruptor `estados_reales` APAGADO; prendido, su
   * contenido vive en ⋮ → «Configuración del robot asistente». */
  .bot-ag{display:flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 6px;border-radius:15px;font-size:12px;font-weight:600;flex-shrink:0;border:1px solid transparent;margin-left:2px}
  .bot-ag .e{font-size:15px;line-height:1}
  .bot-ag.trabajando{background:#e3f6ea;color:#0b6b45;border-color:#bfe5cd}.bot-ag.trabajando .e{animation:latido-ag 1.6s ease-in-out infinite}
  .bot-ag.pausa{background:#fff4d6;color:#8a5a00;border-color:#f0dc8c}
  .bot-ag.cerrado,.bot-ag.dormido{background:#f6f5f3;color:#3b4a54;border-color:var(--linea)}
  .bot-ag.prueba{background:#efeafb;color:#6b4fbb;border-color:#d8cdf4}
  @keyframes latido-ag{50%{opacity:.45}}
  @media (max-width:479px){ .bot-ag{padding:0 7px} .bot-ag .lbl{display:none} }
  .pop-ag{padding:10px 14px 12px;max-width:min(340px,calc(100vw - 32px));white-space:normal}
  .pop-ag b{display:block;font-size:14.5px;margin-bottom:4px}.pop-ag p{font-size:13.5px;color:var(--sec);margin:0 0 10px}
  .pop-ag .acc{display:flex;flex-wrap:wrap;gap:8px}.pop-ag .bt[disabled]{opacity:.4}
  .pop-ag small{display:block;font-size:12px;color:var(--ter);margin-top:10px}
  /* el anillo del avance y el colapso del panel (PC) */
  #avance .avl-anillo{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:6px}
  #avance .avl-pct.rojo{color:var(--rojo)}#avance .avl-pct.ambar{color:#8a5a00}#avance .avl-pct.verde{color:#0b6b45}
  #avance .avl-col{display:none}
  @media (min-width:900px){
    #avance .avl-col{display:flex;position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;color:#3b4a54;font-size:16px;z-index:2}
    #avance .avl-col:hover{background:rgba(11,20,26,.06)}
    #avance .avl-col-i::before{content:'⇥'}#avance .avl-col-i.abre::before{content:'⇤'}
    .app.con-lado #avance .avl-top{padding-right:40px}
    .app.con-lado.lado-col .chat>*:not(#ch):not(.chg-barra):not(#avance):not(.abajo){margin-right:44px}
    .app.con-lado.lado-col #avance{width:44px;overflow:hidden}
    .app.con-lado.lado-col #avance>*:not(.avl-col){display:none!important}
    .app.con-lado.lado-col .abajo{right:56px}
  }

  /* V1.51 · colapsados por omisión (prototipo aprobado: prototipos/v150/colapsados.html) */
  .plg{margin-top:7px;border:1px solid var(--linea);border-radius:10px;background:#f3f6f5;overflow:hidden;max-width:100%}
  .plg-res{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 10px;text-align:left}
  .plg-ic{width:26px;height:26px;border-radius:50%;background:var(--sup);display:flex;align-items:center;justify-content:center;color:var(--acento-osc);flex-shrink:0;font-size:13px;font-weight:700}
  .plg-tx{flex:1;min-width:0}
  .plg-tx b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .plg-tx span{display:block;font-size:12.5px;color:var(--sec);overflow-wrap:anywhere}
  .plg-res .chev{color:var(--sec);transition:transform .15s;flex-shrink:0}
  .plg-res[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .plg-cuerpo{border-top:1px solid var(--linea);padding:4px 10px 8px;background:var(--sup)}
  .plg-cuerpo[hidden]{display:none}
  .carta > .plg:first-child{margin-top:0}
  .rub-carta .plg .rub-tot{font-size:14px;color:inherit}
  /* V1.51 · E · idioma de las respuestas */
  .sel-idioma{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--linea);border-radius:10px;background:var(--sup);margin:4px 0 8px}
  /* V1.51 · B · estado vigente y superado */
  .rub-carta .vig-cab{font-size:12.5px;font-weight:600;color:var(--sec);margin:0 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rub-carta .vig{background:#e7f6ee;color:#0b6b45;border:1px solid #b8e3cb;border-radius:8px;padding:0 6px;font-size:11.5px}
  /* V1.53b · tarjeta colapsada: título con flecha + una línea; lo demás se ve al abrirla */
  .gen-blq{display:flex;flex-direction:column;gap:6px;max-width:min(94%,680px)}.gen-blq .carta{margin:0;max-width:none}
  .carta.cr-pleg > h4{cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .carta.cr-pleg > h4::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--sec);border-bottom:2px solid var(--sec);transform:rotate(45deg);transition:transform .15s;flex-shrink:0}
  .carta.cr-pleg:not(.cr-cerrada) > h4::after{transform:rotate(-135deg)}
  .carta.cr-pleg > .cr-res{font-size:12.5px;color:var(--sec);margin:0 0 4px}
  .carta.cr-pleg:not(.cr-cerrada) > .cr-res{display:none}
  .carta.cr-cerrada > :not(h4):not(.cr-res){display:none!important}
  .carta.superada{opacity:.6;font-size:13px;display:flex;flex-direction:column;gap:4px;max-width:min(82%,520px)}
  .carta.superada s{color:var(--sec)}
  .carta.superada .link{align-self:flex-start;color:var(--acento-osc);font-weight:600;font-size:12.5px;text-align:left;opacity:1}
  .carta.destello{outline:2px solid var(--acento);outline-offset:2px;transition:outline-color .6s}
  /* V1.51 · barra inferior del núcleo (32 px) y la línea de «escribiendo» bajo el título */
  body.con-barra .app{height:calc(100dvh - 32px)}
  body.con-barra:has(.chwa-barra[hidden]) .app{height:100dvh}
  #ch .tx small.esc-wa{min-width:0;display:block}
  @media (min-width:900px){ body.con-barra .chwa-barra{display:none} body.con-barra .app{height:100dvh} }
  /* ═══ V1.52 §13 · ⋮ como hoja del núcleo (teléfono) y las dos configuraciones (czc-). Nada de esto es del chat genérico. ═══ */
  .chwa-hoja .menu.en-hoja{position:static;min-width:0;max-width:none;box-shadow:none;border-radius:0;padding:0 0 4px;background:transparent}
  .chwa-hoja .menu.en-hoja button{padding:12px 18px}
  #estAg{flex-shrink:0;min-width:0}
  .czc{padding:2px 16px 16px;font-size:14px;color:var(--texto)}
  .czc h3{font-size:12.5px;color:var(--acento-osc);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 6px;font-weight:700}
  .czc h3.czc-robot{color:#7b4bb7}.czc h3.czc-adm{color:#7b4bb7}
  .czc-tarj{background:var(--sup2);border-radius:12px;padding:10px 12px;margin-bottom:8px;overflow-wrap:anywhere}
  .czc-tarj>div+div{margin-top:3px}
  .czc-k{font-size:12.5px;color:var(--sec);margin-top:4px}
  .czc-med{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin:7px 0 2px}.czc-med i{display:block;height:100%;background:var(--acento-osc)}
  .czc-fila{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
  /* V1.52.1 · permiso del robot: en teléfono, la hora y el botón van debajo del texto */
  .czc-hora{border:1px solid var(--linea);border-radius:8px;padding:6px 8px;font:inherit;background:var(--sup);color:inherit}
  @media (max-width:520px){.czc-fila.czc-perm-h{flex-wrap:wrap}.czc-fila.czc-perm-h .czc-tx{flex-basis:100%}.czc-fila.czc-perm-h .czc-hora{margin-left:auto}}
  .czc-tx{flex:1;min-width:0}.czc-tx small{display:block;color:var(--sec);font-size:12.5px;overflow-wrap:anywhere}
  .czc-sw{width:42px;height:24px;border-radius:12px;background:var(--ter);position:relative;flex-shrink:0;border:0;cursor:pointer}
  .czc-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .czc-sw.on{background:var(--acento-osc)}.czc-sw.on::after{left:21px}.czc-sw[disabled],.czc-btn[disabled]{opacity:.5;cursor:default}
  .czc-btn{display:inline-flex;align-items:center;gap:6px;background:var(--sup);border:1px solid #d1d7db;border-radius:18px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--texto);flex-shrink:0;cursor:pointer}
  .czc-btn.p{background:var(--acento-osc);color:#fff;border-color:var(--acento-osc)}
  .czc-est{font-size:12px;font-weight:600;color:var(--sec);background:var(--sup2);border-radius:10px;padding:3px 9px;flex-shrink:0}.czc-est.on{color:#0b6b45;background:#e3f6ea}
  .czc-fijo{font-size:12.5px;color:var(--sec);background:var(--sup2);border-radius:10px;padding:8px 10px;margin-top:12px}
  .czc-razon{background:var(--sup2);border-radius:12px;padding:10px 12px;margin:8px 0}
  .czc-razon label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.czc-razon p{font-size:13.5px;margin:0 0 6px}
  .czc-razon input,.czc-campo input,.czc-campo select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid #d1d7db;border-radius:8px;background:var(--sup);color:var(--texto);min-width:0}
  .czc-acc{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:8px}
  .czc-err{color:var(--rojo);font-size:12.5px;margin:6px 0 0}.czc-ok{background:#e3f6ea;color:#0b6b45;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0 0}
  .czc-grupo{display:grid;grid-template-columns:1fr;gap:8px}
  @media (min-width:520px){ .czc-grupo{grid-template-columns:1fr 1fr} }
  .czc-campo{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px}
  .czc-campo>span small{display:block;color:var(--ter);font-size:11px;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
  .czc-rz{margin-top:12px}
  .czc-ints{margin-bottom:6px}.czc-int .czc-tx b{font-size:14px}.czc-int .czc-est{margin-left:4px;vertical-align:1px}
  .czc-tx small.czc-cl{color:var(--ter);font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .czc-conf{background:#fff4d6;color:#5c3d00;border:1px solid #f0dc8c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
  .czc-bit{list-style:none;padding:0;margin:0}.czc-bit li{border-bottom:1px solid var(--linea);padding:7px 0;font-size:13px;overflow-wrap:anywhere}
  .czc-bit small{display:block;color:var(--sec);font-size:12px}
</style>
</head>

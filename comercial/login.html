<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comercial · FTS Suite</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --tx:#1a1d21; --mut:#666;
          --bd:#d8dbe0; --ac:#1d4ed8; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1c2024; --tx:#e8eaed; --mut:#9aa0a6; --bd:#333940; --ac:#5b8def; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--tx); padding:24px;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px;
          padding:28px 24px; width:100%; max-width:360px; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { margin:0 0 22px; color:var(--mut); font-size:13px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--bd);
          border-radius:8px; background:var(--bg); color:var(--tx); }
  input:focus { outline:2px solid var(--ac); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:12px; font-size:15px; font-weight:600;
           border:0; border-radius:8px; background:var(--ac); color:#fff; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-size:13px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.err { display:block; background:color-mix(in srgb, var(--err) 12%, transparent); color:var(--err); }
  .pie { margin-top:18px; font-size:11px; color:var(--mut); text-align:center; }
</style>
</head>
<body>
  <main class="card">
    <h1>Comercial</h1>
    <p class="sub">FTS Suite</p>
    <form id="f" autocomplete="on">
      <label for="u">Usuario</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
      <label for="p">Contraseña</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button id="b" type="submit">Entrar</button>
      <div id="m" class="msg" role="alert" aria-live="polite"></div>
    </form>
    <p class="pie">Sesión de 8 horas · independiente de Finanzas</p>
  </main>

<script src="js/auth-com.js"></script>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), b = document.getElementById('b'), m = document.getElementById('m');

  // Si ya hay sesión viva, no pedir de nuevo.
  if (window.ComAuth && ComAuth.isValid()) { location.replace('index.html'); return; }

  function error(t) { m.className = 'msg err'; m.textContent = t; }

  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    m.className = 'msg'; m.textContent = '';
    b.disabled = true; b.textContent = 'Entrando…';
    var r = await ComAuth.login(document.getElementById('u').value, document.getElementById('p').value);
    if (r.ok) { location.replace('index.html'); return; }
    b.disabled = false; b.textContent = 'Entrar';
    document.getElementById('p').value = '';
    if (r.code === 'LOCKED') {
      var min = Math.ceil((r.retry_after_s || 900) / 60);
      error('Demasiados intentos. Vuelve a intentar en ' + min + ' min.');
    } else if (r.code === 'NETWORK') {
      error(r.msg);
    } else if (r.code === 'SERVER_MISCONFIG') {
      error('El servidor de identidad no está configurado. Avisa a Esteban.');
    } else {
      error('Usuario o contraseña incorrectos.');
    }
  });
})();
</script>
</body>
</html>
